  /admin/vehicles:
    get:
      tags: [admin]
      summary: Araçlar (yönetim)
      description: |
        Sayfalı liste (ADR-24): `{ items, total, page, pageSize }`. Kapalı (`INACTIVE`) araçlar da dahildir. Süzme, arama ve
        sıralama sunucuda yapılır. `q` plakada (boşluk, tire ve büyük/küçük harf fark etmez: `34abc` → `34 ABC 123`) ve modelin
        marka ve adında aranır. Sınır: yönetici başına dakikada 120 (`429 RATE_LIMITED`).
      security:
        - cookieAuth: []
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - name: sort
          in: query
          description: "`alan` ya da `alan:asc|desc`. Varsayılan `plate:asc`."
          schema: { type: string, enum: [plate, year, model, branch, createdAt], example: "year:desc" }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: model, in: query, description: Modelin adresi (`renault-clio`). Olmayan bir model hiçbir şey bulmaz., schema: { type: string } }
        - { name: branch, in: query, description: Bayinin kimliği., schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [ACTIVE, INACTIVE] } }
      responses:
        "200":
          description: Bir sayfa araç
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminVehiclePage" }
        "401":
          description: Oturum yok (`UNAUTHENTICATED`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Yönetici değil (`FORBIDDEN`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      tags: [admin]
      summary: Yeni araç
      description: |
        Araç açık (`ACTIVE`) başlar ve bayisinde, çakışan rezervasyonu olmayan tarihlerde aramada müsait görünür. **Plaka** Türk
        plakasıdır: il kodu (01–81), 1–3 harf (Q, W, X ve Türkçe harfler yok), 2–4 rakam. Nasıl yazılırsa yazılsın büyük harfe
        çevrilir ve `34 ABC 123` biçiminde saklanır; aynı plaka ikinci kez eklenemez (`409 PLATE_TAKEN`). Yıl 2015 ile bu yıl + 1
        arasındadır. **Kapalı bayiye ya da kaldırılmış modele araç eklenemez** (`422`, `fieldErrors.branchId` /
        `fieldErrors.modelSlug` = `UNKNOWN_REFERENCE`). Plaka, yıl ve model sonradan değişmez (yanlışsa araç kapatılır, yenisi
        eklenir). İşlem kaydı: `vehicle.create`.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminVehicleCreate" }
      responses:
        "201":
          description: Eklenen araç
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminVehicle" }
        "401":
          description: Oturum yok (`UNAUTHENTICATED`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Yönetici değil (`FORBIDDEN`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Bu plaka kullanımda (`PLATE_TAKEN`, `fieldErrors.plate`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415": { description: JSON olmayan gövde (`BAD_REQUEST`) }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

