        - { name: actor, in: query, description: "Hesap kimliği ya da `cli`.", schema: { type: string } }
        - { name: entity, in: query, schema: { type: string, maxLength: 60, pattern: "^[a-z][a-z0-9-]{0,59}$" } }
        - { name: from, in: query, schema: { type: string, format: date, example: "2026-10-30" } }
        - { name: to, in: query, schema: { type: string, format: date, example: "2026-10-31" } }
      responses:
