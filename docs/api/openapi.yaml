          type: object
          required: [invoice]
          properties:
            invoice: { type: integer, minimum: 0, description: Aracı olmayan sözleşmelerin fatura satırları; toplamdadır, hiçbir araçta değildir. }
        totals:
          allOf:
            - { $ref: "#/components/schemas/FleetReportMoney" }
            - type: object
              required: [km]
              properties:
                km: { type: integer, minimum: 0 }

