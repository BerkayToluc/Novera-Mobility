openapi: 3.0.3
info:
  title: Novera Mobility API
  version: 0.1.0
  description: |
    Novera Mobility backend sözleşmesi (BACKLOG #6). Frontend tipleri ve MSW mock'ları buradan üretilir.

    ## Genel kurallar (ARCHITECTURE ADR-14…17)

    - **Yollar `/api` öneki olmadan** tanımlıdır. Tarayıcı `/api/...` çağırır, Next öneki kaldırıp iletir.
    - **Oturum:** `novera_session` çerezi (`httpOnly`, `Secure` canlıda, `SameSite=Lax`). İstekler `credentials: "include"` ile atılır. Müşteri oturumu en çok 30 gün, boşta 7 gün; **yönetici oturumu 12 saat, boşta 1 saat** (V2-23).
    - **Yönetim (`/admin/*`):** oturum yoksa `401 UNAUTHENTICATED`, rol `ADMIN` değilse `403 FORBIDDEN`. Yetki API'dedir; her uç aynı koruyucunun arkasındadır.
    - **Zaman:** her an ISO 8601 UTC (`2026-10-12T10:00:00Z`). Alış/iade anları 30 dakikalık dilimlere oturur (`:00` veya `:30`).
    - **Para:** her tutar `{ "amount": 125000, "currency": "TRY" }`. `amount` alt birimin (kuruş/cent) tam sayısıdır. Fiyat uçları `?currency=` alır (varsayılan `TRY`).
    - **Dil:** çevrilen alanlar iki dille birlikte döner (`{ "tr": "...", "en": "..." }`). `?lang` yoktur.
    - **Sayfalama yok.** Düz liste. Sınıf, yakıt, vites filtrelerini ve bayi arama/şehir filtresini frontend yapar; sunucu yalnızca müsaitliği süzer.
    - **Enum yazımı:** `locale` ve `theme` küçük harf (`tr`, `light`), diğer tüm enum'lar büyük harf (`CONFIRMED`, `TRY`).
    - **Gövde:** gövdesi olan her istek `application/json` olmalıdır; başka bir tür (`text/plain`, form) `415` alır (`code: BAD_REQUEST`). Gövde sınırı aşılırsa `413 PAYLOAD_TOO_LARGE`. Gövdesiz çağrılar (çıkış, iptal, `DELETE`) etkilenmez.
    - **Hata biçimi:** `{ code, message, fieldErrors }`. `code` ve `fieldErrors` değerleri sabit makine kodlarıdır; frontend metni kendi çevirisinden gösterir, `message` ekranda gösterilmez. HTTP: 400 bozuk istek, 422 doğrulama, 401 oturum yok, 404, 409 çakışma, 429 hız sınırı (`Retry-After` başlığıyla; her uç verebilir).

    ## Onaylanacak öneriler (G ile)

    Aşağıdakiler benim önerim; PR'da onaylanınca bu liste silinir.

    1. Farklı bayiye bırakma: **ek ücret yok** (v1).
    2. Fiyatlar **KDV dahil**, ayrı KDV kalemi yok.
    3. **Karar (G):** "Kirala"da araç **15 dakika tutulur** (`POST /holds`). Süre dolunca serbest kalır; tutulan araç başka aramada müsait görünmez; bitiş zamanı API'den döner (`expiresAt`). Tutma yüzünden çakışma nadirdir ama yine olursa `POST /reservations` `409 VEHICLE_UNAVAILABLE` döner.
    4. Sahte ödeme için ayrı uç yok: `POST /reservations` ödeme ekranında çağrılır ve rezervasyonu doğrudan `CONFIRMED` oluşturur.
    5. İletişim formu yalnızca veritabanına yazılır, e-posta gönderilmez.
    6. Puan: her tam ₺100 için 1 puan (TRY karşılığı üzerinden, ek hizmetler dahil). Rezervasyonda yazılır ama bakiyeye kiralama BİTİNCE geçer; o zamana kadar `pending` olarak görünür. İptal edilen rezervasyon puan kazandırmaz. Puanla ödeme (1 puan = ₺5, toplamın en çok yarısı) ayrı bir karardır, bu sürümde yoktur.
    7. Gün sayısı: `ceil((endAt - startAt) / 24 saat)`, en az 1.
    8. Kurumsal hesabı Novera açar; sitede kurumsal kayıt yoktur (`/auth/register` yalnızca bireysel).
    9. `POST /quotes` alanları geçicidir (BACKLOG Y35, kurumsal kutu tasarımı onaylanınca netleşir).
    10. Varsayılan tema `light` (SPEC v0.4); `system` seçenek olarak vardır.
    11. **Başlangıç penceresi (V2-02):** `startAt` şu andan en az 30 dakika sonra ve en çok 365 gün sonra olmalıdır; `GET /vehicles`, `POST /holds`, `POST /reservations/price` ve `POST /reservations` aynı kuralı uygular. Erken olan `422 VALIDATION_FAILED` + `fieldErrors.startAt: IN_PAST`, geç olan `OUT_OF_RANGE` döner.

    Kesinleşenler (G, 10 Ekim): 1, 2, 4 ve 6 onaylandı; 3 yukarıdaki gibi değişti.
servers:
  - url: http://localhost:3000
    description: Yerel geliştirme (API doğrudan; tarayıcıdan Next proxy üzerinden `/api` ile)
tags:
  - name: health
  - name: catalog
    description: Bayiler, modeller, araçlar, ek hizmetler, kurlar
  - name: reservations
  - name: auth
  - name: me
  - name: forms
  - name: admin
    description: Yönetim paneli (yalnızca `role = ADMIN`; ADR-24)
  - name: fleet
    description: Filom, kurumsal müşterinin filo paneli (yalnızca etkin kurumsal hesap, kendi şirketinin kayıtları; ADR-25)
paths:
  /health:
    get:
      tags: [health]
      summary: Sağlık kontrolü
      responses:
        "200":
          description: API çalışıyor
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, example: ok }

  /branches:
    get:
      tags: [catalog]
      summary: Tüm bayiler
      description: ~15 bayi, düz liste. Şehir filtresi ve metin arama frontend'dedir. **Kapatılmış bayiler listede yoktur** (V2-27); `kind` havalimanı tezgâhı mı şehir ofisi mi olduğunu söyler.
      responses:
        "200":
          description: Bayi listesi
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Branch" }

  /vehicle-models:
    get:
      tags: [catalog]
      summary: Araç modelleri (Araçlarımız sayfası)
      description: Tüm modeller; her modelin bulunduğu bayilerle birlikte. Müsaitlik filtresi yoktur. **Kaldırılmış (retired) modeller listede yoktur** (V2-29); geçmiş rezervasyonlar onları göstermeye devam eder.
      parameters:
        - $ref: "#/components/parameters/Currency"
      responses:
        "200":
          description: Model listesi
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/VehicleModel" }

  /vehicles:
    get:
      tags: [catalog]
      summary: Müsait araçlar (arama sonuçları)
      description: |
        Alış bayisinde, verilen aralıkta müsait olan araçlar. Aynı modelden birden fazla müsait araç varsa
        model başına bir sonuç döner (`vehicleId` müsait olanlardan biridir). Rezervasyonla çakışanlar
        ve süresi dolmamış bir tutmayla (`/holds`) tutulan araçlar listede çıkmaz.
        Fiyatlar seçilen para biriminde, ek hizmetler hariçtir.

        **Tarih ve bayi parametreleri zorunludur.** Tarihsiz çağrı yoktur; model başına bayi listesi
        (Araçlarımız sayfası) için `GET /vehicle-models` kullanılır.
      parameters:
        - { name: pickupBranchId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: returnBranchId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: startAt, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: endAt, in: query, required: true, schema: { type: string, format: date-time } }
        - $ref: "#/components/parameters/Currency"
      responses:
        "200":
          description: Müsait araçlar (boş liste olabilir)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/VehicleOffer" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /extras:
    get:
      tags: [catalog]
      summary: Ek hizmetler
      parameters:
        - $ref: "#/components/parameters/Currency"
      responses:
        "200":
          description: Ek hizmet listesi
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Extra" }

  /rates:
    get:
      tags: [catalog]
      summary: Güncel kurlar
      description: Günde bir kez güncellenir. Dış servis çökerse son bilinen kur, hiç kur yoksa seed kuru döner.
      responses:
        "200":
          description: Kurlar
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ExchangeRate" }

  /holds:
    post:
      tags: [reservations]
      summary: Aracı 15 dakika tut ("Kirala")
      description: |
        Giriş gerekmez (giriş ödemeden hemen önce istenir). Seçilen aracı verilen aralık için 15 dakika tutar;
        bu sürede araç başka aramalarda müsait görünmez. Dönen `expiresAt` geri sayım içindir.
        Aynı IP için eşzamanlı tutma sayısı sınırlıdır (`429 RATE_LIMITED`); araç tutulamıyorsa
        `409 VEHICLE_UNAVAILABLE`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HoldRequest" }
      responses:
        "201":
          description: Araç tutuldu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hold" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /holds/{id}:
    delete:
      tags: [reservations]
      summary: Tutmayı bırak
      description: |
        Kullanıcı aramayı değiştirir ya da vazgeçerse aracı hemen serbest bırakır. Tutmayı yalnızca onu
        açan istemci bırakabilir (`POST /holds` ile aynı istemci anahtarı). Olmayan, süresi dolmuş ya da
        başkasına ait tutmada da `204` döner; çağrı güvenle tekrarlanabilir ve kimin neyi tuttuğunu göstermez.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Bırakıldı }

  /reservations/price:
    post:
      tags: [reservations]
      summary: Fiyat dökümü (rezervasyon özeti)
      description: |
        Rezervasyon oluşturmadan kalem kalem fiyatı hesaplar. Giriş gerekmez; toplamı sunucu hesaplar.
        `promoCode` verilirse indirim ayrı bir satır olarak gelir (`type: DISCOUNT`).
        `usePoints: true` ile istenirse giriş gerekir (`401`) ve cevap, hesabın bakiyesiyle harcanabilecek
        puanı (`pointsUsed`) ve parayla ödenecek tutarı (`payable`) içerir.
        İstemci başına 10 dakikada en çok 60 istek (`429 RATE_LIMITED`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReservationRequest" }
      responses:
        "200":
          description: Fiyat dökümü
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PriceBreakdown" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /reservations:
    post:
      tags: [reservations]
      summary: Rezervasyon oluştur (sahte ödeme ekranında)
      description: |
        Giriş gerekir. Rezervasyon `CONFIRMED` oluşur, para alınmaz. `holdId` verilirse ve tutma geçerliyse
        araç o tutmaya göre alınır, tutma silinir. Süresi dolmuşsa müsaitlik işlem içinde tekrar kontrol edilir;
        araç hâlâ boşsa devam edilir, değilse `409 VEHICLE_UNAVAILABLE`. Puan aynı işlemde yazılır.
        `usePoints: true` ise puan düşümü de aynı işlemde yapılır; cevaptaki `price.pointsUsed` ve
        `price.payable` kesin değerlerdir. Kazanılan puan, parayla ödenen tutar (`payable`) üzerinden hesaplanır.

        **Sınırlar (V2-03):** kullanıcı başına saatte en çok 10 istek (`429 RATE_LIMITED`); bir hesabın aynı anda
        en çok 3 gelecek ya da devam eden `CONFIRMED` rezervasyonu olabilir, aşılırsa `422 RESERVATION_LIMIT`
        (biri iptal edilince yenisi açılabilir). `holdId` yalnızca tutmayı açan istemcinin adresiyle (istemci
        anahtarı) eşleşirse kendi tutması sayılır; başkasının tutması yokmuş gibi davranılır ve araç o tutmayla
        doluysa `409 VEHICLE_UNAVAILABLE` döner.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReservationRequest" }
      responses:
        "201":
          description: Oluşturuldu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reservation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /me/reservations:
    get:
      tags: [me]
      summary: Rezervasyonlarım
      description: Yeniden eskiye. Yaklaşan/geçmiş ayrımını frontend tarihe göre yapar.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Kullanıcının rezervasyonları
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Reservation" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/reservations/{id}:
    get:
      tags: [me]
      summary: Tek rezervasyon
      description: |
        Giriş yapmış kullanıcının tek rezervasyonu (onay sayfası, `GET /me/reservations` listesinden ya da
        `POST /reservations` cevabındaki `id` ile). Başkasının ya da olmayan rezervasyon `404 NOT_FOUND`.
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Rezervasyon
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reservation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /me/reservations/{id}/cancel:
    post:
      tags: [me]
      summary: Rezervasyonu iptal et
      description: |
        Yalnızca kiralama başlamadan iptal edilir. İptalle araç hemen yeniden müsait olur ve rezervasyon
        puan kazandırmaz. Zaten iptal edilmiş rezervasyonda aynı sonuç (200) döner. Başkasının ya da
        olmayan rezervasyon `404 NOT_FOUND`. Kiralama başlamışsa `409 RESERVATION_NOT_CANCELLABLE`.
        Ücretsiz iptal penceresi (alışa 24 saat) şimdilik yalnızca bilgidir, para akışı yoktur.
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: İptal edilen rezervasyon (durum CANCELLED, kazanılan puan 0)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reservation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /me/points:
    get:
      tags: [me]
      summary: Puanlarım
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Bakiye, geçmiş ve kural metni
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Points" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/quotes:
    get:
      tags: [me]
      summary: Kurumsal teklif taleplerim
      description: Hesaba bağlı teklif talepleri, yeniden eskiye. Giriş yapılmışken gönderilen `POST /quotes` talepleri hesaba bağlanır.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Teklif talepleri listesi
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/QuoteSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me:
    get:
      tags: [me]
      summary: Oturumdaki kullanıcı
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Kullanıcı
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [me]
      summary: Profil ve tercihleri güncelle
      description: Ad, soyad, dil, tema, varsayılan para birimi ve e-posta bildirim tercihleri. E-posta değiştirilemez.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserUpdate" }
      responses:
        "200":
          description: Güncel kullanıcı
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [me]
      summary: Hesabı sil
      description: |
        Hesap kalıcı silinir, oturum sonlanır. Geçmiş rezervasyon kayıtları anonim olarak kalır; hesabın teklif taleplerindeki ad, e-posta, telefon ve notlar hemen silinir (firma adı ve talep edilen araç kalır).
        Şifresi olan hesap `currentPassword` gönderir (eksik `REQUIRED`, yanlış `INVALID_PASSWORD`).
        Yalnızca Google ile açılmış hesap `confirmEmail` gönderir: hesabın e-postası (eksik `REQUIRED`,
        farklı `EMAIL_MISMATCH`). Çalınmış bir oturum çerezi tek başına hesabı silemez.
        15 dakikada en çok 5 deneme (`429`).
      security:
        - cookieAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                currentPassword: { type: string, maxLength: 128 }
                confirmEmail: { type: string, maxLength: 254 }
      responses:
        "204": { description: Silindi }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /me/password:
    post:
      tags: [me]
      summary: Şifre değiştir
      description: |
        Mevcut şifre doğrulanır; yeni şifre en az 8 karakter olur ve eskisinden farklıdır. Başarılı olunca bu oturum
        dışındaki TÜM oturumlar kapanır ve bekleyen şifre sıfırlama bağlantıları geçersiz olur.
        Mevcut şifre yanlışsa `422` (`fieldErrors.currentPassword: INCORRECT`; oturum açık kalır, 401 değildir).
        Yeni şifre için `TOO_SHORT`, `TOO_LONG`, `SAME_AS_CURRENT`, `PASSWORD_TOO_COMMON`. 15 dakikada en çok 5 deneme (`429`).
        Hesabın şifresi yoksa (`User.hasPassword` `false`, Google ile açılmış) `409` (`PASSWORD_NOT_SET`): şifre
        `/auth/forgot-password` ile e-postadaki bağlantıdan belirlenir.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordChange" }
      responses:
        "204": { description: Şifre değişti }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /me/sessions:
    get:
      tags: [me]
      summary: Açık oturumlarım
      description: "Hesabın açık oturumları, yeniden eskiye. İsteği yapan oturum `current: true` ile işaretlidir."
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Açık oturumlar
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SessionInfo" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [me]
      summary: Diğer oturumları kapat
      description: Bu oturum dışındaki tüm oturumlar kapanır.
      security:
        - cookieAuth: []
      responses:
        "204": { description: Kapandı }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/sessions/{id}:
    delete:
      tags: [me]
      summary: Bir oturumu kapat
      description: Hesabın bir oturumunu kapatır. Başkasının ya da olmayan oturum `404 NOT_FOUND`. Kapatılan şu anki oturumsa çerez de silinir.
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Kapandı }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /auth/register:
    post:
      tags: [auth]
      summary: Bireysel kayıt
      description: Başarılı kayıt oturumu da açar (çerez set edilir).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: Hesap oluşturuldu, oturum açıldı
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "409":
          description: E-posta kayıtlı (`EMAIL_TAKEN`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/google:
    post:
      tags: [auth]
      summary: Google ile giriş veya kayıt (yalnızca bireysel)
      description: |
        Web'deki Google düğmesinin verdiği ID token (`credential`) gönderilir; API imzayı, hedef kitleyi (Client ID),
        süreyi ve e-postanın doğrulanmış olmasını denetler. Başarılı olunca oturum çerezi set edilir.
        - Bu Google hesabı daha önce bağlandıysa `200`.
        - Aynı e-postayla şifreli bir bireysel hesap varsa hesap Google'a bağlanır (`200`). Güvenlik için o hesabın
          şifresi silinir ve açık oturumları kapanır; kişi Google ile ya da "şifremi unuttum" ile devam eder.
        - Hesap yoksa yeni bireysel hesap açılır (`201`) ve `consent: true` gerekir. Onay yoksa `422`
          (`fieldErrors.consent: CONSENT_REQUIRED`) döner ve hesap açılmaz; ön yüz onay kutusunu gösterip aynı
          `credential` ile `consent: true` göndererek yeniden dener.
        Kurumsal ve yönetici hesaplar Google ile giriş yapamaz (`403`, `GOOGLE_NOT_ALLOWED`). 15 dakikada istemci başına en çok
        10 deneme (`429`). Sunucuda `GOOGLE_CLIENT_ID` yoksa `503` (`GOOGLE_SIGNIN_UNAVAILABLE`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GoogleSignInRequest" }
      responses:
        "200":
          description: Mevcut hesapla oturum açıldı
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "201":
          description: Yeni hesap açıldı, oturum açıldı
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401":
          description: Google belirteci doğrulanamadı (`GOOGLE_TOKEN_INVALID`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Bu hesap (kurumsal ya da yönetici) Google ile giriş yapamaz (`GOOGLE_NOT_ALLOWED`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503":
          description: Google ile giriş bu sunucuda ayarlı değil (`GOOGLE_SIGNIN_UNAVAILABLE`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/login:
    post:
      tags: [auth]
      summary: Giriş (bireysel ve kurumsal)
      description: Tek uç. Kurumsal kullanıcıda yanıttaki `accountType` `CORPORATE` olur.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Oturum açıldı
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401":
          description: E-posta veya şifre yanlış (`INVALID_CREDENTIALS`). Hangisi olduğunu belli etmez.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/logout:
    post:
      tags: [auth]
      summary: Çıkış
      responses:
        "204": { description: Oturum sonlandı }

  /auth/forgot-password:
    post:
      tags: [auth]
      summary: Şifre sıfırlama bağlantısı iste
      description: |
        E-posta kayıtlı olsun olmasın her zaman `202` döner (kullanıcı varlığı sızdırılmaz).
        Gerçek e-posta gönderilmez; bağlantı sunucu konsoluna yazılır (canlıda yazılmaz, e-posta BACKLOG #49).
        Bağlantı biçimi: `{WEB_URL}/{tr|en}/sifre-sifirla/yeni?token=...`. Bağlantı 1 saat geçerlidir ve
        bir hesapta aynı anda tek bağlantı yaşar (yenisi eskisini geçersiz kılar).
        Sınır: istemci başına 5, e-posta başına 3 istek/saat (`429 RATE_LIMITED`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "202": { description: Talep alındı }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/reset-password:
    post:
      tags: [auth]
      summary: Yeni şifre belirle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 8 }
      responses:
        "204":
          description: Şifre değişti. Bağlantı kullanılmış sayılır ve hesabın tüm oturumları kapanır (yeniden giriş gerekir).
        "422":
          description: |
            Alanlar geçersiz (`VALIDATION_FAILED`, ör. `password: TOO_SHORT`; bağlantı bu durumda harcanmaz) ya da
            bağlantı geçersiz, kullanılmış veya süresi dolmuş (`RESET_TOKEN_INVALID`; üçü ayırt edilmez).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /quotes:
    post:
      tags: [forms]
      summary: Kurumsal teklif / görüşme talebi
      description: |
        Alanlar geçicidir (BACKLOG Y35). `website` görünmeyen tuzak alandır: doluysa `422 SPAM_DETECTED`.
        Giriş yapmış kurumsal kullanıcıda talep hesaba bağlanır.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuoteRequest" }
      responses:
        "201":
          description: Talep alındı
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Received" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /contact:
    post:
      tags: [forms]
      summary: İletişim formu
      description: |
        `website` tuzak alanı doluysa `422 SPAM_DETECTED`. IP başına hız sınırı uygulanır.
        KVKK onay zamanı sunucuda kaydedilir.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactRequest" }
      responses:
        "201":
          description: Mesaj alındı
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Received" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /admin/summary:
    get:
      tags: [admin]
      summary: Yönetim paneli Özet ekranı
      description: |
        Panelin ilk ekranının sayıları (V2-25). Yalnızca okur; işlem kaydına yazılmaz. "Bugün" **İstanbul takvim günüdür**
        (00:00 dahil, ertesi gün 00:00 hariç), sunucunun ya da tarayıcının saat diliminden bağımsız. Sınır: yönetici başına
        dakikada 120 (`429 RATE_LIMITED`).
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Sayılar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSummary" }
        "401":
          description: Oturum yok (`UNAUTHENTICATED`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Giriş yapılmış ama yönetici değil (`FORBIDDEN`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /admin/promo-codes:
    get:
      tags: [admin]
      summary: Kampanya kodları listesi
      description: |
        Sayfalı liste (ADR-24): `{ items, total, page, pageSize }`. Her satırda kodun **durumu** ve kullanım sayısı vardır.
        Tablo küçük ve elle yönetilir; süzme, arama ve sıralama sunucuda yapılır.

        Durum tek bir değerdir; birden fazlası doğruysa şu sırayla ilki: `INACTIVE` (kapalı), `EXPIRED` (bitişi geçti),
        `EXHAUSTED` (tavan doldu), `SCHEDULED` (henüz başlamadı), `ACTIVE`. `ACTIVE` yalnızca rezervasyon anında
        uygulanacak kod demektir. Sınır: yönetici başına dakikada 120 (`429 RATE_LIMITED`).
      security:
        - cookieAuth: []
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - name: sort
          in: query
          description: "`alan` ya da `alan:asc|desc`. Varsayılan `createdAt:desc`. Bitişi olmayan kod en uzak bitiş sayılır."
          schema: { type: string, enum: [code, percent, used, validUntil, createdAt], example: "percent:desc" }
        - { name: q, in: query, description: Kodun bir parçası; büyük/küçük harf ve boşluk fark etmez., schema: { type: string, maxLength: 20 } }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/PromoCodeStatus" }
      responses:
        "200":
          description: Bir sayfa kod
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PromoCodePage" }
        "401":
          description: Oturum yok (`UNAUTHENTICATED`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Yönetici değil (`FORBIDDEN`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      tags: [admin]
      summary: Yeni kampanya kodu
      description: |
        Kod büyük harfe çevrilir, boşluklar atılır; harf ve rakam, 3–20 karakter. Yüzde 1–90. `validUntil`, `validFrom`'dan
        sonra olmalı (`INVALID_DATE_RANGE`). Aynı ad varsa `409 CODE_TAKEN`. İşlem kaydına `promo-code.create` olarak yazılır
        (yalnızca alan adları). Kod oluşunca rezervasyon özetinde hemen kullanılabilir.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PromoCodeCreate" }
      responses:
        "201":
          description: Oluşturulan kod
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PromoCode" }
        "401":
          description: Oturum yok (`UNAUTHENTICATED`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Yönetici değil (`FORBIDDEN`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Bu ad kullanımda (`CODE_TAKEN`, `fieldErrors.code`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415": { description: JSON olmayan gövde (`BAD_REQUEST`) }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /admin/promo-codes/{code}:
    parameters:
      - name: code
        in: path
        required: true
        description: Kod; büyük/küçük harf fark etmez. Kod olamayacak bir değer `404` döner.
        schema: { type: string, example: YAZ25 }
    get:
      tags: [admin]
      summary: Bir kampanya kodu
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Kod
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PromoCode" }
        "401":
          description: Oturum yok (`UNAUTHENTICATED`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Yönetici değil (`FORBIDDEN`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Böyle bir kod yok (`NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    patch:
      tags: [admin]
      summary: Kampanya kodunu değiştir
      description: |
        Yalnızca gönderilen alanlar değişir (`null` = "yok": `validFrom`, `validUntil`, `maxRedemptions` temizlenir). Kodun
        adı değişmez. İstek, düzenlenen kaydın `updatedAt` değerini taşır; kayıt arada değiştiyse `409 STALE_WRITE`
        döner ve hiçbir şey yazılmaz. Tavan şimdiye kadarki kullanımdan az olamaz (`422 maxRedemptions: BELOW_USAGE`).
        Yüzdeyi değiştirmek var olan rezervasyonların tutarını etkilemez (tutar rezervasyonda donmuştur). Kod satırı
        rezervasyon anındaki gibi kilitlenir; aynı anda gelen rezervasyonla sırayla çalışır. İşlem kaydı: `promo-code.update`.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PromoCodeUpdate" }
      responses:
        "200":
          description: Değişen kod (yeni `updatedAt` ile)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PromoCode" }
        "401":
          description: Oturum yok (`UNAUTHENTICATED`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Yönetici değil (`FORBIDDEN`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Böyle bir kod yok (`NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Kayıt arada değişti (`STALE_WRITE`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415": { description: JSON olmayan gövde (`BAD_REQUEST`) }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    delete:
      tags: [admin]
      summary: Kampanya kodunu sil
      description: |
        Yalnızca hiçbir rezervasyonda kullanılmamış kod silinir. Bir rezervasyonda, iptal edilmiş olsa bile, geçmişse
        `409 IN_USE` döner ve **hiçbir şey değişmez**; kod `PATCH` ile `active: false` yapılarak kapatılır (ekran bunu önerir).
        İşlem kaydı: `promo-code.delete`.
      security:
        - cookieAuth: []
      responses:
        "204": { description: Silindi }
        "401":
          description: Oturum yok (`UNAUTHENTICATED`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Yönetici değil (`FORBIDDEN`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Böyle bir kod yok (`NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Kod bir rezervasyonda kullanılmış (`IN_USE`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /admin/branches:
    get:
      tags: [admin]
      summary: Bayiler (yönetim)
      description: |
        Sayfalı liste (ADR-24): `{ items, total, page, pageSize }`. **Kapalı bayiler de dahildir** (herkese açık `GET /branches`
        onları döndürmez). Tablo küçük ve elle yönetilir; süzme, arama ve sıralama sunucuda yapılır. Arama ad, şehir ve
        adreste yapılır, büyük/küçük harf ve Türkçe harfler fark etmez (`kadikoy` → Kadıköy).
        Sınır: yönetici başına dakikada 120 (`429 RATE_LIMITED`).
      security:
        - cookieAuth: []
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - name: sort
          in: query
          description: "`alan` ya da `alan:asc|desc`. Varsayılan `name:asc`."
          schema: { type: string, enum: [name, city, activeVehicles, createdAt], example: "city:asc" }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: city, in: query, description: 81 ilden biri., schema: { type: string, example: İzmir } }
        - { name: status, in: query, schema: { type: string, enum: [OPEN, CLOSED] } }
      responses:
        "200":
          description: Bir sayfa bayi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminBranchPage" }
        "401":
          description: Oturum yok (`UNAUTHENTICATED`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Yönetici değil (`FORBIDDEN`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      tags: [admin]
      summary: Yeni bayi
      description: |
        Bayi hemen sitede görünür (Bayilerimiz, arama seçici, harita). Bütün alanlar zorunludur. Şehir 81 ilden biri; enlem
        36–42, boylam 26–45 derece dolayında (Türkiye'yi kapsayan kutu; `OUT_OF_RANGE`); çalışma saatleri üç gün, her biri
        `HH:MM-HH:MM` (açılış kapanıştan önce) ya da `closed`. İşlem kaydı: `branch.create`.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminBranchCreate" }
      responses:
        "201":
          description: Oluşturulan bayi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminBranch" }
        "401":
          description: Oturum yok (`UNAUTHENTICATED`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Yönetici değil (`FORBIDDEN`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415": { description: JSON olmayan gövde (`BAD_REQUEST`) }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /admin/branches/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [admin]
      summary: Bir bayi ve neyin onu açık tuttuğu
      description: "`usage`, bayiyi kapatmayı engelleyen şeylerin sayısıdır; ekran kapatma düğmesine basılmadan nedenleri söyler."
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Bayi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminBranchDetail" }
        "401":
          description: Oturum yok (`UNAUTHENTICATED`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Yönetici değil (`FORBIDDEN`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Böyle bir bayi yok ya da kimlik biçimi yanlış (`NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    patch:
      tags: [admin]
      summary: Bayiyi değiştir
      description: |
        Yalnızca gönderilen alanlar değişir. İstek, düzenlenen kaydın `updatedAt` değerini taşır; kayıt arada değiştiyse
        `409 STALE_WRITE` döner ve hiçbir şey yazılmaz. Kapalı bayi de düzeltilebilir. Kapatma ve yeniden açma bu uçla değil,
        `/close` ve `/reopen` ile yapılır. İşlem kaydı: `branch.update`.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminBranchUpdate" }
      responses:
        "200":
          description: Değişen bayi (yeni `updatedAt` ile)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminBranch" }
        "401":
          description: Oturum yok (`UNAUTHENTICATED`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Yönetici değil (`FORBIDDEN`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Böyle bir bayi yok (`NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Kayıt arada değişti (`STALE_WRITE`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415": { description: JSON olmayan gövde (`BAD_REQUEST`) }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /admin/branches/{id}/close:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [admin]
      summary: Bayiyi kapat
      description: |
        Bayi silinmez, kapatılır; geçmiş rezervasyonlar adını taşımaya devam eder. Kapatılan bayi herkese açık `GET /branches`'te,
        aramada, tutmada, fiyatta ve rezervasyonda yoktur. **Şunlardan biri varsa `409 IN_USE`** döner ve hiçbir şey değişmez;
        `details` her birinin sayısını taşır:
        - `reservations`: gelecekte başlayan (alış bu bayide) ya da bitecek (dönüş bu bayide) iptal edilmemiş rezervasyon; sürmekte
          olan ama buraya dönecek kiralama da sayılır;
        - `holds`: süresi dolmamış araç tutma;
        - `vehicles`: bayideki, açık (`active`) araç.

        Bayi satırı rezervasyon ve tutmanın aldığı paylaşımlı kilidin karşısında `FOR UPDATE` ile alınır; aynı anda gelen bir
