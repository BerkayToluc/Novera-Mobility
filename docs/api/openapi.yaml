          description: Araç
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminVehicleDetail" }
        "401":
          description: Oturum yok (`UNAUTHENTICATED`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Yönetici değil (`FORBIDDEN`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Böyle bir araç yok (`NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    patch:
      tags: [admin]
      summary: Aracı başka bayiye taşı, kapat ya da yeniden aç
      description: |
        Yalnızca `branchId` ve `active` değişir; `plate`, `year` ve `modelSlug` gönderilirse `422 NOT_ALLOWED` döner. Düzenlenen
        kaydın `updatedAt` değeri geri gönderilir; araç bu arada değiştiyse `409 STALE_WRITE`. **Taşımak ve kapatmak**, aracın
        gelecekte başlayacak iptal edilmemiş rezervasyonu ya da süresi dolmamış tutması varsa `409 IN_USE` döner
        (`details.reservations`, `details.holds`); hiçbir şey değişmez. Taşınan bayi açık olmalıdır (`fieldErrors.branchId` =
        `UNKNOWN_REFERENCE`). **Yeniden açmak** için modelin kaldırılmamış ve bayinin açık olması gerekir
        (`fieldErrors.active` = `NOT_ALLOWED`). İşlem kaydı: `vehicle.update`.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminVehicleUpdate" }
      responses:
        "200":
          description: Güncel araç
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminVehicle" }
        "401":
          description: Oturum yok (`UNAUTHENTICATED`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Yönetici değil (`FORBIDDEN`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Böyle bir araç yok (`NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Kayıt değişmiş (`STALE_WRITE`) ya da araç kullanımda (`IN_USE`, sayılar `details` içinde)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415": { description: JSON olmayan gövde (`BAD_REQUEST`) }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

