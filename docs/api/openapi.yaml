  /admin/vehicle-models:
    get:
      tags: [admin]
      summary: Araç modelleri (yönetim)
      description: |
        Sayfalı liste (ADR-24): `{ items, total, page, pageSize }`. **Kaldırılmış modeller de dahildir** (herkese açık
        `GET /vehicle-models` onları döndürmez). Tablo küçük ve elle yönetilir; süzme, arama ve sıralama sunucuda yapılır.
        Arama marka, model ve adreste yapılır, büyük/küçük harf ve Türkçe harfler fark etmez (`sahin` → Şahin).
        Sınır: yönetici başına dakikada 120 (`429 RATE_LIMITED`).
      security:
        - cookieAuth: []
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - name: sort
          in: query
          description: "`alan` ya da `alan:asc|desc`. Varsayılan `name:asc` (marka ve model)."
          schema: { type: string, enum: [name, dailyPrice, activeVehicles, createdAt], example: "dailyPrice:desc" }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: class, in: query, description: Sınıf adresi (`ekonomik`). Olmayan bir sınıf hiçbir şey bulmaz., schema: { type: string } }
        - { name: fuel, in: query, schema: { $ref: "#/components/schemas/FuelType" } }
        - { name: status, in: query, schema: { type: string, enum: [ACTIVE, RETIRED] } }
      responses:
        "200":
          description: Bir sayfa model
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminVehicleModelPage" }
        "401":
          description: Oturum yok (`UNAUTHENTICATED`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Yönetici değil (`FORBIDDEN`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      tags: [admin]
      summary: Yeni araç modeli
      description: |
        Model hemen sitede görünür (ana sayfa filo bölümü, `?arac=` penceresi); aracı yoksa aramada çıkmaz, araçlar V2-30'da
        eklenir. **Adres (`slug`) isteğe bağlıdır**: verilmezse marka ve modelden üretilir (`Renault Clio` → `renault-clio`,
        Türkçe harfler sadeleşir); küçük harf, rakam ve tire, en az 3 karakter. Aynı adres varsa `409 SLUG_TAKEN`. Adres
        **sonradan değişmez** (`?arac=` bağlantıları bozulmasın). Tüketim birimi verilmez: elektrikte kWh/100 km, diğerlerinde
        L/100 km. Açıklama iki dilde de zorunlu. `imageUrl` yalnızca `/fleet/` altında bir site yolu ya da fotoğraf deposunun
        adresi olabilir (ADR-28); boş bırakılırsa site yer tutucu çizer. Fiyat TRY kuruş cinsinden, en çok 10.000.000 (₺100.000).
        İşlem kaydı: `vehicle-model.create`.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminVehicleModelCreate" }
      responses:
        "201":
          description: Oluşturulan model
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminVehicleModel" }
        "401":
          description: Oturum yok (`UNAUTHENTICATED`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Yönetici değil (`FORBIDDEN`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Bu adres kullanımda (`SLUG_TAKEN`, `fieldErrors.slug`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415": { description: JSON olmayan gövde (`BAD_REQUEST`) }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /admin/vehicle-models/{slug}:
    parameters:
