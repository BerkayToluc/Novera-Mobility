openapi: 3.0.3
info:
  title: Novera Mobility API
  version: 0.1.0
  description: |
    Novera Mobility backend sözleşmesi (BACKLOG #6). Frontend tipleri ve MSW mock'ları buradan üretilir.

    ## Genel kurallar (ARCHITECTURE ADR-14…17)

    - **Yollar `/api` öneki olmadan** tanımlıdır. Tarayıcı `/api/...` çağırır, Next öneki kaldırıp iletir.
    - **Oturum:** `novera_session` çerezi (`httpOnly`, `Secure` canlıda, `SameSite=Lax`). İstekler `credentials: "include"` ile atılır.
    - **Zaman:** her an ISO 8601 UTC (`2026-10-12T10:00:00Z`). Alış/iade anları 30 dakikalık dilimlere oturur (`:00` veya `:30`).
    - **Para:** her tutar `{ "amount": 125000, "currency": "TRY" }`. `amount` alt birimin (kuruş/cent) tam sayısıdır. Fiyat uçları `?currency=` alır (varsayılan `TRY`).
    - **Dil:** çevrilen alanlar iki dille birlikte döner (`{ "tr": "...", "en": "..." }`). `?lang` yoktur.
    - **Sayfalama yok.** Düz liste. Sınıf, yakıt, vites filtrelerini ve bayi arama/şehir filtresini frontend yapar; sunucu yalnızca müsaitliği süzer.
    - **Enum yazımı:** `locale` ve `theme` küçük harf (`tr`, `light`), diğer tüm enum'lar büyük harf (`CONFIRMED`, `TRY`).
    - **Hata biçimi:** `{ code, message, fieldErrors }`. `code` ve `fieldErrors` değerleri sabit makine kodlarıdır; frontend metni kendi çevirisinden gösterir, `message` ekranda gösterilmez. HTTP: 400 bozuk istek, 422 doğrulama, 401 oturum yok, 404, 409 çakışma, 429 hız sınırı.

    ## Onaylanacak öneriler (G ile)

    Aşağıdakiler benim önerim; PR'da onaylanınca bu liste silinir.

    1. Farklı bayiye bırakma: **ek ücret yok** (v1).
    2. Fiyatlar **KDV dahil**, ayrı KDV kalemi yok.
    3. **Karar (G):** "Kirala"da araç **15 dakika tutulur** (`POST /holds`). Süre dolunca serbest kalır; tutulan araç başka aramada müsait görünmez; bitiş zamanı API'den döner (`expiresAt`). Tutma yüzünden çakışma nadirdir ama yine olursa `POST /reservations` `409 VEHICLE_UNAVAILABLE` döner.
    4. Sahte ödeme için ayrı uç yok: `POST /reservations` ödeme ekranında çağrılır ve rezervasyonu doğrudan `CONFIRMED` oluşturur.
    5. İletişim formu yalnızca veritabanına yazılır, e-posta gönderilmez.
    6. Puan: her tam ₺100 için 1 puan (TRY karşılığı üzerinden, ek hizmetler dahil). Rezervasyonda yazılır ama bakiyeye kiralama BİTİNCE geçer; o zamana kadar `pending` olarak görünür. İptal edilen rezervasyon puan kazandırmaz. Puanla ödeme (1 puan = ₺5, toplamın en çok yarısı) ayrı bir karardır, bu sürümde yoktur.
    7. Gün sayısı: `ceil((endAt - startAt) / 24 saat)`, en az 1.
    8. Kurumsal hesabı Novera açar; sitede kurumsal kayıt yoktur (`/auth/register` yalnızca bireysel).
    9. `POST /quotes` alanları geçicidir (BACKLOG Y35, kurumsal kutu tasarımı onaylanınca netleşir).
    10. Varsayılan tema `light` (SPEC v0.4); `system` seçenek olarak vardır.

    Kesinleşenler (G, 10 Ekim): 1, 2, 4 ve 6 onaylandı; 3 yukarıdaki gibi değişti.
servers:
  - url: http://localhost:3000
    description: Yerel geliştirme (API doğrudan; tarayıcıdan Next proxy üzerinden `/api` ile)
tags:
  - name: health
  - name: catalog
    description: Bayiler, modeller, araçlar, ek hizmetler, kurlar
  - name: reservations
  - name: auth
  - name: me
  - name: content
    description: SSS, ürünler, hizmetler
  - name: forms
paths:
  /health:
    get:
      tags: [health]
      summary: Sağlık kontrolü
      responses:
        "200":
          description: API çalışıyor
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, example: ok }

  /branches:
    get:
      tags: [catalog]
      summary: Tüm bayiler
      description: ~15 bayi, düz liste. Şehir filtresi ve metin arama frontend'dedir.
      responses:
        "200":
          description: Bayi listesi
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Branch" }

  /vehicle-models:
    get:
      tags: [catalog]
      summary: Araç modelleri (Araçlarımız sayfası)
      description: Tüm modeller; her modelin bulunduğu bayilerle birlikte. Müsaitlik filtresi yoktur.
      parameters:
        - $ref: "#/components/parameters/Currency"
      responses:
        "200":
          description: Model listesi
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/VehicleModel" }

  /vehicles:
    get:
      tags: [catalog]
      summary: Müsait araçlar (arama sonuçları)
      description: |
        Alış bayisinde, verilen aralıkta müsait olan araçlar. Aynı modelden birden fazla müsait araç varsa
        model başına bir sonuç döner (`vehicleId` müsait olanlardan biridir). Rezervasyonla çakışanlar
        ve süresi dolmamış bir tutmayla (`/holds`) tutulan araçlar listede çıkmaz.
        Fiyatlar seçilen para biriminde, ek hizmetler hariçtir.

        **Tarih ve bayi parametreleri zorunludur.** Tarihsiz çağrı yoktur; model başına bayi listesi
        (Araçlarımız sayfası) için `GET /vehicle-models` kullanılır.
      parameters:
        - { name: pickupBranchId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: returnBranchId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: startAt, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: endAt, in: query, required: true, schema: { type: string, format: date-time } }
        - $ref: "#/components/parameters/Currency"
      responses:
        "200":
          description: Müsait araçlar (boş liste olabilir)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/VehicleOffer" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /extras:
    get:
      tags: [catalog]
      summary: Ek hizmetler
      parameters:
        - $ref: "#/components/parameters/Currency"
      responses:
        "200":
          description: Ek hizmet listesi
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Extra" }

  /rates:
    get:
      tags: [catalog]
      summary: Güncel kurlar
      description: Günde bir kez güncellenir. Dış servis çökerse son bilinen kur, hiç kur yoksa seed kuru döner.
      responses:
        "200":
          description: Kurlar
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ExchangeRate" }

  /holds:
    post:
      tags: [reservations]
      summary: Aracı 15 dakika tut ("Kirala")
      description: |
        Giriş gerekmez (giriş ödemeden hemen önce istenir). Seçilen aracı verilen aralık için 15 dakika tutar;
        bu sürede araç başka aramalarda müsait görünmez. Dönen `expiresAt` geri sayım içindir.
        Aynı IP için eşzamanlı tutma sayısı sınırlıdır (`429 RATE_LIMITED`); araç tutulamıyorsa
        `409 VEHICLE_UNAVAILABLE`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HoldRequest" }
      responses:
        "201":
          description: Araç tutuldu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hold" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /holds/{id}:
    delete:
      tags: [reservations]
      summary: Tutmayı bırak
      description: |
        Kullanıcı aramayı değiştirir ya da vazgeçerse aracı hemen serbest bırakır. Tutmayı yalnızca onu
        açan istemci bırakabilir (`POST /holds` ile aynı istemci anahtarı). Olmayan, süresi dolmuş ya da
        başkasına ait tutmada da `204` döner; çağrı güvenle tekrarlanabilir ve kimin neyi tuttuğunu göstermez.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Bırakıldı }

  /reservations/price:
    post:
      tags: [reservations]
      summary: Fiyat dökümü (rezervasyon özeti)
      description: |
        Rezervasyon oluşturmadan kalem kalem fiyatı hesaplar. Giriş gerekmez; toplamı sunucu hesaplar.
        `promoCode` verilirse indirim ayrı bir satır olarak gelir (`type: DISCOUNT`).
        `usePoints: true` ile istenirse giriş gerekir (`401`) ve cevap, hesabın bakiyesiyle harcanabilecek
        puanı (`pointsUsed`) ve parayla ödenecek tutarı (`payable`) içerir.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReservationRequest" }
      responses:
        "200":
          description: Fiyat dökümü
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PriceBreakdown" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /reservations:
    post:
      tags: [reservations]
      summary: Rezervasyon oluştur (sahte ödeme ekranında)
      description: |
        Giriş gerekir. Rezervasyon `CONFIRMED` oluşur, para alınmaz. `holdId` verilirse ve tutma geçerliyse
        araç o tutmaya göre alınır, tutma silinir. Süresi dolmuşsa müsaitlik işlem içinde tekrar kontrol edilir;
        araç hâlâ boşsa devam edilir, değilse `409 VEHICLE_UNAVAILABLE`. Puan aynı işlemde yazılır.
        `usePoints: true` ise puan düşümü de aynı işlemde yapılır; cevaptaki `price.pointsUsed` ve
        `price.payable` kesin değerlerdir. Kazanılan puan, parayla ödenen tutar (`payable`) üzerinden hesaplanır.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReservationRequest" }
      responses:
        "201":
          description: Oluşturuldu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reservation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /me/reservations:
    get:
      tags: [me]
      summary: Rezervasyonlarım
      description: Yeniden eskiye. Yaklaşan/geçmiş ayrımını frontend tarihe göre yapar.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Kullanıcının rezervasyonları
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Reservation" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/reservations/{id}:
    get:
      tags: [me]
      summary: Tek rezervasyon
      description: |
        Giriş yapmış kullanıcının tek rezervasyonu (onay sayfası, `GET /me/reservations` listesinden ya da
        `POST /reservations` cevabındaki `id` ile). Başkasının ya da olmayan rezervasyon `404 NOT_FOUND`.
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Rezervasyon
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reservation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /me/reservations/{id}/cancel:
    post:
      tags: [me]
      summary: Rezervasyonu iptal et
      description: |
        Yalnızca kiralama başlamadan iptal edilir. İptalle araç hemen yeniden müsait olur ve rezervasyon
        puan kazandırmaz. Zaten iptal edilmiş rezervasyonda aynı sonuç (200) döner. Başkasının ya da
        olmayan rezervasyon `404 NOT_FOUND`. Kiralama başlamışsa `409 RESERVATION_NOT_CANCELLABLE`.
        Ücretsiz iptal penceresi (alışa 24 saat) şimdilik yalnızca bilgidir, para akışı yoktur.
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: İptal edilen rezervasyon (durum CANCELLED, kazanılan puan 0)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reservation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /me/points:
    get:
      tags: [me]
      summary: Puanlarım
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Bakiye, geçmiş ve kural metni
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Points" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/quotes:
    get:
      tags: [me]
      summary: Kurumsal teklif taleplerim
      description: Hesaba bağlı teklif talepleri, yeniden eskiye. Giriş yapılmışken gönderilen `POST /quotes` talepleri hesaba bağlanır.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Teklif talepleri listesi
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/QuoteSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me:
    get:
      tags: [me]
      summary: Oturumdaki kullanıcı
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Kullanıcı
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [me]
      summary: Profil ve tercihleri güncelle
      description: Ad, soyad, dil, tema, varsayılan para birimi ve e-posta bildirim tercihleri. E-posta değiştirilemez.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserUpdate" }
      responses:
        "200":
          description: Güncel kullanıcı
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [me]
      summary: Hesabı sil
      description: Hesap kalıcı silinir, oturum sonlanır. Geçmiş rezervasyon kayıtları anonim olarak kalır.
      security:
        - cookieAuth: []
      responses:
        "204": { description: Silindi }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/password:
    post:
      tags: [me]
      summary: Şifre değiştir
      description: |
        Mevcut şifre doğrulanır; yeni şifre en az 8 karakter olur ve eskisinden farklıdır. Başarılı olunca bu oturum
        dışındaki TÜM oturumlar kapanır ve bekleyen şifre sıfırlama bağlantıları geçersiz olur.
        Mevcut şifre yanlışsa `422` (`fieldErrors.currentPassword: INCORRECT`; oturum açık kalır, 401 değildir).
        Yeni şifre için `TOO_SHORT`, `TOO_LONG`, `SAME_AS_CURRENT`. 15 dakikada en çok 5 deneme (`429`).
        Hesabın şifresi yoksa (`User.hasPassword` `false`, Google ile açılmış) `409` (`PASSWORD_NOT_SET`): şifre
        `/auth/forgot-password` ile e-postadaki bağlantıdan belirlenir.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordChange" }
      responses:
        "204": { description: Şifre değişti }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /me/sessions:
    get:
      tags: [me]
      summary: Açık oturumlarım
      description: "Hesabın açık oturumları, yeniden eskiye. İsteği yapan oturum `current: true` ile işaretlidir."
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Açık oturumlar
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SessionInfo" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [me]
      summary: Diğer oturumları kapat
      description: Bu oturum dışındaki tüm oturumlar kapanır.
      security:
        - cookieAuth: []
      responses:
        "204": { description: Kapandı }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/sessions/{id}:
    delete:
      tags: [me]
      summary: Bir oturumu kapat
      description: Hesabın bir oturumunu kapatır. Başkasının ya da olmayan oturum `404 NOT_FOUND`. Kapatılan şu anki oturumsa çerez de silinir.
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Kapandı }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /auth/register:
    post:
      tags: [auth]
      summary: Bireysel kayıt
      description: Başarılı kayıt oturumu da açar (çerez set edilir).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: Hesap oluşturuldu, oturum açıldı
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "409":
          description: E-posta kayıtlı (`EMAIL_TAKEN`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/google:
    post:
      tags: [auth]
      summary: Google ile giriş veya kayıt (yalnızca bireysel)
      description: |
        Web'deki Google düğmesinin verdiği ID token (`credential`) gönderilir; API imzayı, hedef kitleyi (Client ID),
        süreyi ve e-postanın doğrulanmış olmasını denetler. Başarılı olunca oturum çerezi set edilir.
        - Bu Google hesabı daha önce bağlandıysa `200`.
        - Aynı e-postayla şifreli bir bireysel hesap varsa hesap Google'a bağlanır (`200`). Güvenlik için o hesabın
          şifresi silinir ve açık oturumları kapanır; kişi Google ile ya da "şifremi unuttum" ile devam eder.
        - Hesap yoksa yeni bireysel hesap açılır (`201`) ve `consent: true` gerekir. Onay yoksa `422`
          (`fieldErrors.consent: CONSENT_REQUIRED`) döner ve hesap açılmaz; ön yüz onay kutusunu gösterip aynı
          `credential` ile `consent: true` göndererek yeniden dener.
        Kurumsal hesaplar Google ile giriş yapamaz (`403`, `GOOGLE_NOT_ALLOWED`). 15 dakikada istemci başına en çok
        10 deneme (`429`). Sunucuda `GOOGLE_CLIENT_ID` yoksa `503` (`GOOGLE_SIGNIN_UNAVAILABLE`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GoogleSignInRequest" }
      responses:
        "200":
          description: Mevcut hesapla oturum açıldı
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "201":
          description: Yeni hesap açıldı, oturum açıldı
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401":
          description: Google belirteci doğrulanamadı (`GOOGLE_TOKEN_INVALID`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Bu hesap Google ile giriş yapamaz (`GOOGLE_NOT_ALLOWED`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503":
          description: Google ile giriş bu sunucuda ayarlı değil (`GOOGLE_SIGNIN_UNAVAILABLE`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/login:
    post:
      tags: [auth]
      summary: Giriş (bireysel ve kurumsal)
      description: Tek uç. Kurumsal kullanıcıda yanıttaki `accountType` `CORPORATE` olur.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Oturum açıldı
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401":
          description: E-posta veya şifre yanlış (`INVALID_CREDENTIALS`). Hangisi olduğunu belli etmez.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/logout:
    post:
      tags: [auth]
      summary: Çıkış
      responses:
        "204": { description: Oturum sonlandı }

  /auth/forgot-password:
    post:
      tags: [auth]
      summary: Şifre sıfırlama bağlantısı iste
      description: |
        E-posta kayıtlı olsun olmasın her zaman `202` döner (kullanıcı varlığı sızdırılmaz).
        Gerçek e-posta gönderilmez; bağlantı sunucu konsoluna yazılır (canlıda yazılmaz, e-posta BACKLOG #49).
        Bağlantı biçimi: `{WEB_URL}/{tr|en}/sifre-sifirla/yeni?token=...`. Bağlantı 1 saat geçerlidir ve
        bir hesapta aynı anda tek bağlantı yaşar (yenisi eskisini geçersiz kılar).
        Sınır: istemci başına 5, e-posta başına 3 istek/saat (`429 RATE_LIMITED`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "202": { description: Talep alındı }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/reset-password:
    post:
      tags: [auth]
      summary: Yeni şifre belirle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 8 }
      responses:
        "204":
          description: Şifre değişti. Bağlantı kullanılmış sayılır ve hesabın tüm oturumları kapanır (yeniden giriş gerekir).
        "422":
          description: |
            Alanlar geçersiz (`VALIDATION_FAILED`, ör. `password: TOO_SHORT`; bağlantı bu durumda harcanmaz) ya da
            bağlantı geçersiz, kullanılmış veya süresi dolmuş (`RESET_TOKEN_INVALID`; üçü ayırt edilmez).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /faq:
    get:
      tags: [content]
      summary: Sık sorulan sorular
      description: |
        `audience` verilirse yalnızca o kitlenin soruları döner (ana sayfa, kitle sekmesine göre).
        Verilmezse tüm sorular döner (Yardım merkezi); her kayıt kendi `audience` ve `topic` değerini taşır.
        Sıra: önce bireysel, sonra kurumsal; her kitle kendi içinde `sortOrder` sırasıyla.
      parameters:
        - name: audience
          in: query
          required: false
          schema: { $ref: "#/components/schemas/FaqAudience" }
      responses:
        "200":
          description: Sıralı soru listesi
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FaqItem" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  /products:
    get:
      tags: [content]
      summary: Ürünler
      responses:
        "200":
          description: Sıralı ürün listesi
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Product" }

  /products/{slug}:
    get:
      tags: [content]
      summary: Ürün detayı
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string, example: akilli-kurumsal-filo } }
      responses:
        "200":
          description: Ürün
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "404": { $ref: "#/components/responses/NotFound" }

  /services:
    get:
      tags: [content]
      summary: Hizmetler
      responses:
        "200":
          description: Sıralı hizmet listesi
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Service" }

  /quotes:
    post:
      tags: [forms]
      summary: Kurumsal teklif / görüşme talebi
      description: |
        Alanlar geçicidir (BACKLOG Y35). `website` görünmeyen tuzak alandır: doluysa `422 SPAM_DETECTED`.
        Giriş yapmış kurumsal kullanıcıda talep hesaba bağlanır.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuoteRequest" }
      responses:
        "201":
          description: Talep alındı
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Received" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /contact:
    post:
      tags: [forms]
      summary: İletişim formu
      description: |
        `website` tuzak alanı doluysa `422 SPAM_DETECTED`. IP başına hız sınırı uygulanır.
        KVKK onay zamanı sunucuda kaydedilir.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactRequest" }
      responses:
        "201":
          description: Mesaj alındı
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Received" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: novera_session

  parameters:
    Currency:
      name: currency
      in: query
      required: false
      description: Tutarların döneceği para birimi. Varsayılan `TRY`.
      schema: { $ref: "#/components/schemas/Currency" }

  responses:
    BadRequest:
      description: Bozuk istek (`BAD_REQUEST`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Oturum yok (`UNAUTHENTICATED`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Bulunamadı (`NOT_FOUND`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Çakışma (`VEHICLE_UNAVAILABLE`, `RESERVATION_NOT_CANCELLABLE`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationFailed:
      description: Doğrulama hatası (`VALIDATION_FAILED`, alan hataları `fieldErrors` içinde)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Hız sınırı aşıldı (`RATE_LIMITED`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    # ---------- Ortak ----------
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Sabit makine kodu.
          enum:
            - BAD_REQUEST
            - VALIDATION_FAILED
            - UNAUTHENTICATED
            - INVALID_CREDENTIALS
            - EMAIL_TAKEN
            - NOT_FOUND
            - VEHICLE_UNAVAILABLE
            - INVALID_DATE_RANGE
            - RESET_TOKEN_INVALID
            - SPAM_DETECTED
            - RATE_LIMITED
            - PAYLOAD_TOO_LARGE
            - INTERNAL_ERROR
        message:
          type: string
          description: Geliştirici için İngilizce metin. Ekranda gösterilmez.
        fieldErrors:
          type: object
          description: Alan adı → sabit hata kodu.
          additionalProperties:
            type: string
            enum:
              - REQUIRED
              - INVALID_EMAIL
              - INVALID_FORMAT
              - TOO_SHORT
              - TOO_LONG
              - OUT_OF_RANGE
              - EMAIL_TAKEN
              - CONSENT_REQUIRED
              - INVALID_DATE_RANGE
              - NOT_IN_SLOT
              - UNKNOWN_REFERENCE
          example: { email: EMAIL_TAKEN }

    LocalizedText:
      type: object
      required: [tr, en]
      properties:
        tr: { type: string }
        en: { type: string }

    LocalizedList:
      type: object
      required: [tr, en]
      properties:
        tr: { type: array, items: { type: string } }
        en: { type: array, items: { type: string } }

    Currency:
      type: string
      enum: [TRY, EUR, USD]

    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: integer
          format: int64
          description: Alt birimin (kuruş/cent) tam sayısı. 125000 TRY = ₺1.250.
          example: 125000
        currency: { $ref: "#/components/schemas/Currency" }

    QuoteStatus:
      type: string
      enum: [RECEIVED, IN_REVIEW, OFFERED]

    QuoteSummary:
      type: object
      required: [id, number, createdAt, vehicleCount, durationMonths, status]
      properties:
        id: { type: string, format: uuid }
        number: { type: string, example: TKL-2026-00042 }
        createdAt: { type: string, format: date-time }
        vehicleCount: { type: integer, example: 10 }
        durationMonths: { type: integer, example: 24 }
        productSlug: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/QuoteStatus" }

    Received:
      type: object
      required: [received]
      properties:
        received: { type: boolean, example: true }

    # ---------- Katalog ----------
    OpeningHours:
      type: object
      description: Her alan `"08:30-19:00"` biçiminde ya da `"closed"`.
      required: [weekdays, saturday, sunday]
      properties:
        weekdays: { type: string, example: "08:30-19:00" }
        saturday: { type: string, example: "09:00-17:00" }
        sunday: { type: string, example: closed }

    BranchRef:
      type: object
      required: [id, name, city]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        city: { type: string }

    Branch:
      type: object
      required: [id, name, city, address, latitude, longitude, phone, email, openingHours, vehicleModels]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: İzmir Adnan Menderes Havalimanı }
        city: { type: string, example: İzmir }
        address: { type: string }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        phone: { type: string }
        email: { type: string, format: email }
        openingHours: { $ref: "#/components/schemas/OpeningHours" }
        vehicleModels:
          type: array
          description: Bayideki modeller (arama formundaki bayi önizlemesi için).
          items:
            type: object
            required: [slug, brand, model]
            properties:
              slug: { type: string }
              brand: { type: string }
              model: { type: string }

    VehicleClass:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string, example: ekonomik }
        name: { $ref: "#/components/schemas/LocalizedText" }

    Consumption:
      type: object
      required: [value, unit]
      properties:
        value: { type: number, example: 4.5 }
        unit:
          type: string
          enum: [L_PER_100KM, KWH_PER_100KM]

    VehicleModelBase:
      type: object
      required: [slug, brand, model, class, seats, bags, transmission, fuelType, consumption, description, imageUrl]
      properties:
        slug: { type: string, example: toyota-corolla-hybrid }
        brand: { type: string, example: Toyota }
        model: { type: string, example: Corolla Hybrid }
        class: { $ref: "#/components/schemas/VehicleClass" }
        seats: { type: integer }
        bags: { type: integer }
        transmission: { type: string, enum: [MANUAL, AUTOMATIC] }
        fuelType: { type: string, enum: [PETROL, DIESEL, HYBRID, ELECTRIC] }
        consumption: { $ref: "#/components/schemas/Consumption" }
        description: { $ref: "#/components/schemas/LocalizedText" }
        imageUrl: { type: string, nullable: true }

    VehicleModel:
      allOf:
        - $ref: "#/components/schemas/VehicleModelBase"
        - type: object
          required: [fromDailyPrice, branches]
          properties:
            fromDailyPrice: { $ref: "#/components/schemas/Money" }
            branches:
              type: array
              items: { $ref: "#/components/schemas/BranchRef" }

    VehicleOffer:
      type: object
      required: [vehicleId, year, model, branch, days, dailyPrice, totalPrice]
      properties:
        vehicleId: { type: string, format: uuid }
        year: { type: integer, example: 2025, description: Aracın model yılı (`vehicleId` olan fiziksel araç). }
        model: { $ref: "#/components/schemas/VehicleModelBase" }
        branch: { $ref: "#/components/schemas/BranchRef" }
        days: { type: integer, example: 3 }
        dailyPrice: { $ref: "#/components/schemas/Money" }
        totalPrice:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: Araç için toplam (ek hizmet hariç). `dailyPrice × days`, aynı para biriminde.

    Extra:
      type: object
      required: [slug, name, price, pricing]
      properties:
        slug: { type: string, example: cocuk-koltugu }
        name: { $ref: "#/components/schemas/LocalizedText" }
        price: { $ref: "#/components/schemas/Money" }
        pricing:
          type: string
          enum: [PER_DAY, FIXED]

    ExchangeRate:
      type: object
      required: [currency, ratePerTry, updatedAt]
      properties:
        currency: { $ref: "#/components/schemas/Currency" }
        ratePerTry:
          type: number
          description: 1 TRY kaç `currency` ediyor (TRY için 1).
          example: 0.0291
        updatedAt: { type: string, format: date-time }

    # ---------- Rezervasyon ----------
    ReservationRequest:
      type: object
      required: [vehicleId, pickupBranchId, returnBranchId, startAt, endAt, currency]
      properties:
        vehicleId: { type: string, format: uuid }
        pickupBranchId: { type: string, format: uuid }
        returnBranchId: { type: string, format: uuid }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        currency: { $ref: "#/components/schemas/Currency" }
        holdId:
          type: string
          format: uuid
          description: "`POST /holds` cevabındaki tutma. Yalnızca `POST /reservations` kullanır; isteğe bağlı."
        promoCode:
          type: string
          nullable: true
          pattern: "^[A-Za-z0-9]{3,20}$"
          example: NOVERA10
          description: |
            Kampanya kodu. Büyük/küçük harf ve boşluk fark etmez; sunucu büyük harfe çevirir. Kod, araç ve
            ek hizmetlerin toplamından yüzde olarak düşer (aşağı yuvarlanır), sonra puan uygulanır.
            Biçime uymayan değer `422` (`fieldErrors.promoCode: INVALID_FORMAT`).
            **`POST /reservations/price`**: olmayan, kapalı ya da tarihi geçmiş kod hata değildir; fiyat
            düz kalır ve cevaptaki `promo.applied` `false` olur ("kod geçerli değil" denir).
            **`POST /reservations`**: böyle bir kodla rezervasyon yapılmaz (`422`, `fieldErrors.promoCode:
            UNKNOWN_CODE`), çünkü ziyaretçi indirim göreceğini sanmıştır.
        usePoints:
          type: boolean
          description: |
            Puanla öde (gönderilmezse `false`). Giriş gerekir; yalnızca bireysel hesapta ve `currency: TRY` iken kullanılabilir
            (aksi halde `422`, `fieldErrors.usePoints: NOT_ALLOWED`). 1 puan ₺5'dir; harcanan puan, bakiye ve
            toplamın yarısıyla sınırlıdır, kiralama bedava olmaz. Kaç puanın harcandığını sunucu hesaplar
            (`pointsUsed`); istemci puan sayısı göndermez.
        extras:
          type: array
          items:
            type: object
            required: [slug, quantity]
            properties:
              slug: { type: string }
              quantity: { type: integer, minimum: 1, maximum: 10 }

    HoldRequest:
      type: object
      required: [vehicleId, pickupBranchId, returnBranchId, startAt, endAt]
      properties:
        vehicleId: { type: string, format: uuid }
        pickupBranchId: { type: string, format: uuid }
        returnBranchId: { type: string, format: uuid }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }

    Hold:
      type: object
      required: [id, vehicleId, expiresAt]
      properties:
        id: { type: string, format: uuid }
        vehicleId: { type: string, format: uuid }
        expiresAt:
          type: string
          format: date-time
          description: Tutmanın bittiği an (UTC). Geri sayım bununla yapılır; istemci saatine güvenilmez.

    PriceLine:
      type: object
      required: [type, slug, label, quantity, unitPrice, total]
      properties:
        type:
          type: string
          enum: [VEHICLE, EXTRA, DISCOUNT]
          description: |
            `DISCOUNT`, kampanya kodunun düştüğü tutardır: tek satır, her zaman en sonda, tutarları **eksi**.
            Böylece satırların toplamı yine `total`'a tam eşit kalır.
        slug:
          type: string
          description: Araç satırında modelin, ek hizmet satırında ek hizmetin, indirim satırında kodun `slug` değeri. Satırı adıyla değil bununla eşleştirin.
          example: cocuk-koltugu
        label: { $ref: "#/components/schemas/LocalizedText" }
        quantity:
          type: integer
          description: Araç için gün sayısı; ek hizmet için adet (günlük ek hizmette adet × gün).
        unitPrice: { $ref: "#/components/schemas/Money" }
        total: { $ref: "#/components/schemas/Money" }

    PriceBreakdown:
      type: object
      description: |
        Birim fiyatlar önce hedef para biriminin alt birimine çevrilir, sonra adet/günle çarpılır;
        bu yüzden satır toplamlarının toplamı `total`'a tam eşittir (ekranda yuvarlama yok).
      required: [currency, exchangeRate, days, lines, total, promo, pointsUsed, payable]
      properties:
        currency: { $ref: "#/components/schemas/Currency" }
        exchangeRate:
          type: number
          description: Hesapta kullanılan kur (1 TRY = ? currency).
        days: { type: integer }
        lines:
          type: array
          items: { $ref: "#/components/schemas/PriceLine" }
        total:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: "Kalemlerin toplamı: araç ve ek hizmetler eksi kampanya indirimi, puan düşülmeden."
        promo:
          type: object
          nullable: true
          description: "İstekte kod gönderildiyse kodun ne olduğu; gönderilmediyse `null`. Rezervasyonda her zaman `applied: true`."
          required: [code, applied, percent]
          properties:
            code: { type: string, example: NOVERA10 }
            applied: { type: boolean, description: Kod fiyattan bir şey düştü mü. }
            percent: { type: integer, nullable: true, description: Uygulanan yüzde; `applied` `false` ise `null`. }
        pointsUsed:
          type: integer
          description: Bu rezervasyonda puanla ödenen puan sayısı (kullanılmadıysa 0). İptalde iade edilir.
        payable:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: Puan düşüldükten sonra parayla ödenecek tutar (`total` − `pointsUsed` × ₺5). Puan kullanılmadıysa `total`'a eşittir.

    Reservation:
      type: object
      required: [id, number, status, vehicle, pickupBranch, returnBranch, startAt, endAt, price, pointsEarned, createdAt]
      properties:
        id: { type: string, format: uuid }
        number: { type: string, example: NVR-2026-00123 }
        status: { type: string, enum: [CONFIRMED, CANCELLED] }
        vehicle:
          type: object
          required: [id, year, model]
          properties:
            id: { type: string, format: uuid }
            year: { type: integer, example: 2025 }
            model: { $ref: "#/components/schemas/VehicleModelBase" }
        pickupBranch: { $ref: "#/components/schemas/BranchRef" }
        returnBranch: { $ref: "#/components/schemas/BranchRef" }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        price: { $ref: "#/components/schemas/PriceBreakdown" }
        pointsEarned: { type: integer, example: 12 }
        createdAt: { type: string, format: date-time }

    Points:
      type: object
      required: [balance, pending, history, rules]
      properties:
        balance: { type: integer, description: Kiralaması bitmiş rezervasyonların puanı. }
        pending: { type: integer, description: Kiralaması henüz bitmemiş (yaklaşan) rezervasyonların puanı. }
        history:
          type: array
          items:
            type: object
            required: [points, createdAt]
            properties:
              points: { type: integer, description: "Kazanılan puan artı, rezervasyonda harcanan puan eksi işaretlidir." }
              reservationNumber: { type: string, nullable: true }
              createdAt: { type: string, format: date-time, description: Puanın hesaba geçtiği an (kiralamanın bitişi). }
        rules: { $ref: "#/components/schemas/LocalizedText" }

    # ---------- Hesap ----------
    User:
      type: object
      required: [id, email, firstName, lastName, accountType, companyName, taxOffice, companyCity, companyPhone, contactTitle, salesContact, locale, theme, currency, hasPassword, googleLinked]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        firstName: { type: string }
        lastName: { type: string }
        accountType: { type: string, enum: [INDIVIDUAL, CORPORATE] }
        companyName: { type: string, nullable: true }
        taxOffice: { type: string, nullable: true, description: Vergi dairesi. Yalnızca kurumsal hesapta dolu; bireyselde `null`. }
        companyCity: { type: string, nullable: true, description: Şirketin şehri. Yalnızca kurumsal hesapta dolu. }
        companyPhone: { type: string, nullable: true, description: Şirket telefonu. Yalnızca kurumsal hesapta dolu. }
        contactTitle: { type: string, nullable: true, description: Yetkilinin ünvanı. Yalnızca kurumsal hesapta dolu. }
        salesContact:
          type: object
          nullable: true
          description: Hesabın satış temsilcisi. Yalnızca kurumsal hesapta dolu; yoksa `null`.
          required: [name, email, phone]
          properties:
            name: { type: string }
            email: { type: string, format: email }
            phone: { type: string }
        locale: { type: string, enum: [tr, en] }
        theme: { type: string, enum: [light, dark, system], description: Varsayılan `light`. }
        currency: { $ref: "#/components/schemas/Currency" }
        notifications: { $ref: "#/components/schemas/Notifications" }
        hasPassword:
          type: boolean
          description: "`false` ise hesap Google ile açılmış ve henüz şifresi yok (şifre belirlemek için `/auth/forgot-password` akışı kullanılır, `/me/password` 409 döner)."
        googleLinked: { type: boolean, description: Hesap bir Google hesabına bağlı mı. }

    Notifications:
      type: object
      description: E-posta tercihleri. Varsayılan hatırlatma açık, kampanya kapalı (pazarlama postası için onay gerekir).
      required: [reminders, campaigns]
      properties:
        reminders: { type: boolean, description: Seyahat öncesi hatırlatma e-postası. }
        campaigns: { type: boolean, description: Kampanya e-postaları. }

    PasswordChange:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string }
        newPassword: { type: string, minLength: 8, maxLength: 128 }

    SessionInfo:
      type: object
      required: [id, current, createdAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        current: { type: boolean, description: İsteği yapan oturum. }
        device: { type: string, nullable: true, example: Chrome · Windows, description: Girişte tarayıcının bildirdiğinden çıkarılan kısa ad; bilinmiyorsa null. }
        createdAt: { type: string, format: date-time, description: Oturumun açıldığı an. }
        expiresAt: { type: string, format: date-time }

    UserUpdate:
      type: object
      description: Gönderilen alanlar güncellenir.
      properties:
        firstName: { type: string, minLength: 1, maxLength: 80 }
        lastName: { type: string, minLength: 1, maxLength: 80 }
        locale: { type: string, enum: [tr, en] }
        theme: { type: string, enum: [light, dark, system] }
        currency: { $ref: "#/components/schemas/Currency" }
        notifications:
          type: object
          description: Gönderilen alanlar güncellenir.
          properties:
            reminders: { type: boolean }
            campaigns: { type: boolean }

    RegisterRequest:
      type: object
      required: [email, password, firstName, lastName, consent]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 128 }
        firstName: { type: string, minLength: 1, maxLength: 80 }
        lastName: { type: string, minLength: 1, maxLength: 80 }
        consent:
          type: boolean
          description: Gizlilik/KVKK onayı. `false` ise `fieldErrors.consent = CONSENT_REQUIRED`.

    GoogleSignInRequest:
      type: object
      required: [credential]
      properties:
        credential: { type: string, maxLength: 4096, description: Google Identity Services'in verdiği ID token. }
        consent:
          type: boolean
          description: "Gizlilik/KVKK onayı. Yeni hesap açılacaksa `true` olmalı; mevcut hesapta gerekmez."

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    # ---------- İçerik ----------
    FaqAudience:
      type: string
      enum: [INDIVIDUAL, CORPORATE]

    FaqTopic:
      type: string
      description: Sorunun konusu (Yardım merkezi bu değere göre gruplar).
      enum: [rezervasyon, odeme, teslim, hasar, hesap, kurumsal]

    FaqItem:
      type: object
      required: [id, audience, topic, question, answer]
      properties:
        id: { type: string, format: uuid }
        audience: { $ref: "#/components/schemas/FaqAudience" }
        topic: { $ref: "#/components/schemas/FaqTopic" }
        question: { $ref: "#/components/schemas/LocalizedText" }
        answer: { $ref: "#/components/schemas/LocalizedText" }

    Product:
      type: object
      required: [slug, title, concept, whatYouGet, techBenefits, featured]
      properties:
        slug: { type: string, example: akilli-kurumsal-filo }
        title: { $ref: "#/components/schemas/LocalizedText" }
        concept: { $ref: "#/components/schemas/LocalizedText" }
        whatYouGet: { $ref: "#/components/schemas/LocalizedText" }
        techBenefits: { $ref: "#/components/schemas/LocalizedList" }
        featured:
          type: boolean
          description: '"En çok tercih edilen" rozeti.'

    Service:
      type: object
      required: [slug, title, summary, points]
      properties:
        slug: { type: string, example: akilli-yol-yardim }
        title: { $ref: "#/components/schemas/LocalizedText" }
        summary: { $ref: "#/components/schemas/LocalizedText" }
        points: { $ref: "#/components/schemas/LocalizedList" }

    # ---------- Formlar ----------
    QuoteRequest:
      type: object
      description: Geçici alanlar (BACKLOG Y35).
      required: [companyName, vehicleCount, durationMonths, vehicleType, email, consent]
      properties:
        companyName: { type: string, minLength: 1, maxLength: 160 }
        vehicleCount: { type: integer, minimum: 1, maximum: 10000 }
        durationMonths: { type: integer, minimum: 1, maximum: 120 }
        vehicleType: { type: string, description: Araç sınıfı slug'ı veya serbest metin. }
        email: { type: string, format: email }
        productSlug: { type: string, nullable: true }
        consent: { type: boolean }
        website:
          type: string
          description: Tuzak alan. Boş olmalı.

    ContactRequest:
      type: object
      required: [name, email, subject, message, consent]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        email: { type: string, format: email }
        phone: { type: string, nullable: true, maxLength: 30 }
        subject: { type: string, minLength: 1, maxLength: 160 }
        message: { type: string, minLength: 1, maxLength: 4000 }
        consent: { type: boolean }
        website:
          type: string
          description: Tuzak alan. Boş olmalı.