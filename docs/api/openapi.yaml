  /admin/invoices/generate:
    post:
      tags: [admin]
      summary: Ayın faturalarını oluştur
      description: |
        Verilen ay (`period=2026-10`) için etkin sözleşmesi olan her şirkete **bir fatura** keser. Bir sözleşmenin satırı, aylık bedelin ayda kapsadığı gün sayısına oranıdır (iki uç gün dahil, yarım yukarı kuruşa yuvarlanır); ara toplam satırların toplamı, KDV %20 (yarım yukarı), toplam ikisinin toplamıdır. Düzenlenme günü bugün (İstanbul), vade 30 gün sonradır. Numara `FTR-<yıl>-<5 hane>` bir sequence'ten gelir.
        **Bir şirkete bir ayın tek faturası kesilir** (veritabanında benzersiz; ay, `pg_advisory_xact_lock` ile kilitlenir). Ay zaten kesilmişse `409 ALREADY_GENERATED`; gelecekteki ay `422 OUT_OF_RANGE`. Kesilecek bir şey yoksa hiçbir şey oluşmaz (`created: 0`). İşlem kaydı: `invoice.generate` (kayıt kimliği ay).
      security:
        - cookieAuth: []
      parameters:
        - { name: period, in: query, required: true, description: "Ay, `YYYY-MM`.", schema: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$", example: "2026-10" } }
      responses:
        "200":
          description: Kesilen faturalar
          content:
            application/json:
