            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Böyle bir araç yok (`NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Kayıt değişmiş (`STALE_WRITE`) ya da araç iade edilmiş (`INVALID_TRANSITION`)
