        - { name: end, in: query, description: "\"Bugün biten kiralama\" kartı: kiralaması bugün (İstanbul günü) bitenler.", schema: { type: string, enum: [today] } }
        - { name: created, in: query, description: "\"Son 7 günde yapılan rezervasyon\" kartı: bugün ve önceki altı gün (İstanbul günleri) içinde yapılanlar.", schema: { type: string, enum: [last7days] } }
