          type: object
          nullable: true
          description: Yazılmış son batarya sağlığı; hiç yoksa null.
          required: [percent, at]
          properties:
            percent: { type: integer, minimum: 0, maximum: 100 }
            at: { type: string, format: date-time }
        batteryTrend:
          type: array
          description: Son 6 ayın batarya sağlığı okumaları, eskiden yeniye.
          items:
            type: object
            required: [at, percent]
            properties:
              at: { type: string, format: date-time }
              percent: { type: integer, minimum: 0, maximum: 100 }
        km: { type: integer, minimum: 0, description: Dönemin kilometresi. }
        savedGrams: { type: integer, minimum: 0, description: "Dönemde tasarruf edilen CO₂, gram (örnek hesap)." }

    GreenReport:
      type: object
      required: [from, to, vehicles, totals, coefficients]
