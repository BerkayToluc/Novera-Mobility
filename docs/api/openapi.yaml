          items:
            allOf:
              - { $ref: "#/components/schemas/FleetReportMoney" }
              - type: object
                required: [period, km]
                properties:
                  period: { type: string, example: "2026-10" }
                  km: { type: integer, minimum: 0 }
        vehicles:
          type: array
          description: Maliyeti ya da kilometresi olan araçlar, maliyete göre çoktan aza.
          items:
            allOf:
              - { $ref: "#/components/schemas/FleetReportMoney" }
              - type: object
                required: [id, plate, model, km]
                properties:
                  id: { type: string, format: uuid }
                  plate: { type: string }
                  model: { type: string }
                  km: { type: integer, minimum: 0 }
        departments:
          type: array
          description: "Departman bazında; `department: null` kimsenin kullanmadığı ya da departmanı olmayan kişinin payıdır."
