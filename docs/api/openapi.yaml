    get:
      tags: [admin]
      summary: Bir araç ve neyin onu yerinde tuttuğu
      description: "`usage`, taşımayı ve kapatmayı engelleyen şeylerin sayısıdır; ekran düğmeye basılmadan nedenleri söyler."
      security:
        - cookieAuth: []
      responses:
