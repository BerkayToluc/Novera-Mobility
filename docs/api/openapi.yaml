          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Bu sözleşme için işlemdeki bir yenileme talebi var (`ALREADY_REQUESTED`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415": { description: JSON olmayan gövde (`BAD_REQUEST`) }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /fleet/reports:
    get:
      tags: [fleet]
      summary: Dönem raporu
      description: |
        Şirketin bir ay aralığındaki (`from` ve `to`, `YYYY-MM`, ikisi dahil; ikisi de yoksa bu ay, biri yoksa tek ay) **maliyeti ve kilometresi**: ay, araç ve departman bazında. En çok 24 ay; henüz başlamamış ay ve ters sıra `422` `OUT_OF_RANGE`.
        **Maliyet = fatura payı + masraflar.** Faturalar KDV'siz, satırlarının toplamıyla (ara toplam) alınır: bir faturanın bir satırı, sözleşmenin **tüm araçları** arasında eşit bölünür (plaka sırasıyla; bölünmeyen kuruşlar ilk araçlara gider), böylece toplam faturalarla kuruşu kuruşuna tutar. Aracı olmayan sözleşmenin satırı hiçbir araca düşmez, `unallocated`'dadır ve toplamdadır. Fatura, ait olduğu **dönemin** ayına; masraf, gerçekleştiği **İstanbul ayına** yazılır.
        **Departman:** faturada o ayın son anında, masrafta masrafın anında aracı kimin kullandığına göre kişinin departmanıdır; kimse kullanmıyorsa ya da kişinin departmanı yoksa `null`. **Kilometre:** ayın sonundaki ile başındaki okumanın farkı (okuma yoksa aracın başlangıç km'si); ay toplamları dönem toplamına eşittir.
        Aynı toplam üç kesitte de tutar: aylar, departmanlar ve (`unallocated` ile birlikte) araçlar. Yalnızca **kurumsal hesabın kendi şirketinin** verisi gelir. Sınır: hesap başına dakikada 120.
      security:
        - cookieAuth: []
      parameters:
        - { name: from, in: query, description: "İlk ay, `YYYY-MM`.", schema: { type: string, example: "2026-08" } }
        - { name: to, in: query, description: "Son ay, `YYYY-MM`.", schema: { type: string, example: "2026-10" } }
      responses:
        "200":
          description: Rapor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FleetReport" }
        "401":
          description: Oturum yok (`UNAUTHENTICATED`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Kurumsal hesap değil ya da bir şirkete bağlı değil (`FORBIDDEN`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /fleet/green:
    get:
      tags: [fleet]
      summary: Yeşil Filo
      description: |
        Şirketin **elektrikli ve hibrit** (kullanımdaki) araçları: son şarj seviyesi, batarya sağlığı ve son 6 ayın okumalarından eğilimi, dönemin kilometresi ve **karbon tasarrufu**. Dönem `from` ve `to` (`YYYY-MM`, ikisi dahil, en çok 24 ay; ikisi de yoksa son 3 ay, yalnız `to` varsa tek ay). Başlamamış ay ve ters sıra `422 OUT_OF_RANGE`.
        **Karbon tasarrufu bir örnek hesaptır** (ekranda yazar): kilometre × (benzinli eşdeğer − aracın emisyonu); katsayılar g CO₂/km olarak cevapta (`coefficients`: benzin 170, hibrit 105, elektrikli 45) ve tek yerde (`src/fleet/fleet-report.ts`). Şarj seviyesi ve batarya sağlığı Novera'nın girdiği okumalardır (simülasyon değil). Kilometre, rapordaki gibi dönem sonu ve başındaki okumanın farkıdır.
        Yalnızca **kurumsal hesabın kendi şirketinin** araçları gelir; elektrikli ya da hibrit aracı yoksa `vehicles` boştur. Sınır: hesap başına dakikada 120.
      security:
        - cookieAuth: []
      parameters:
        - { name: from, in: query, description: "İlk ay, `YYYY-MM`.", schema: { type: string, example: "2026-08" } }
        - { name: to, in: query, description: "Son ay, `YYYY-MM`.", schema: { type: string, example: "2026-10" } }
      responses:
        "200":
          description: Yeşil Filo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GreenReport" }
        "401":
          description: Oturum yok (`UNAUTHENTICATED`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Kurumsal hesap değil ya da bir şirkete bağlı değil (`FORBIDDEN`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /fleet/vehicles/{plate}/charging-stations:
    parameters:
      - { name: plate, in: path, required: true, description: "Plaka; boşluksuz ya da küçük harfle de olur.", schema: { type: string, example: 06 FLM 201 } }
    get:
      tags: [fleet]
      summary: Aracın en yakın şarj istasyonları
      description: |
        Aracın konumuna en yakın istasyonlar, yakından uzağa. **Cevap bir simülasyondur** (ADR-30): `simulated: true`. Araç henüz canlı konum üretmediği için (V2-43) **sözleşmesinin teslim şehrinin merkezinde** sayılır; o şehrin merkezi bilinmiyorsa istasyonlar uzaklıksız (`distanceKm: null`) ve aracın kendi şehrindekiler önce gelir. İstasyonun durumu (`AVAILABLE`, `BUSY`, `OUT_OF_ORDER`) saklanmaz: istasyon kimliği ve **5 dakikalık dilimden** deterministik üretilir, yani aynı araç ve aynı dilim için her istek aynı cevabı verir (`updatedAt` dilimin başlangıcıdır).
        Elektrikli ya da hibrit olmayan araç, başka şirketin aracı ve plaka olamayacak değer aynı `404`'tür. Sınır: hesap başına dakikada 120.
      security:
        - cookieAuth: []
      parameters:
        - { name: limit, in: query, description: "Kaç istasyon (1–20, varsayılan 5).", schema: { type: integer, minimum: 1, maximum: 20, default: 5 } }
      responses:
        "200":
          description: En yakın istasyonlar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StationList" }
        "401":
          description: Oturum yok (`UNAUTHENTICATED`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Kurumsal hesap değil ya da bir şirkete bağlı değil (`FORBIDDEN`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Böyle bir elektrikli ya da hibrit araç yok ya da başka şirketin (`NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /admin/ping:

    get:
      tags: [admin]
      summary: Yönetici kapısı denemesi (iskelet)
      description: |
        Kapıyı kanıtlar: oturumsuz `401`, müşteri `403`, yönetici `200`. Hiçbir şeyi değiştirmez. V2-25'te
        V2-25 ile `GET /admin/summary` geldi; bu uç kapı ve işlem kaydı testleri için kalır. Sınır: yönetici başına dakikada 120 (`429 RATE_LIMITED`).
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Yönetici
          content:
            application/json:
              schema:
                type: object
                required: [ok, role]
                properties:
                  ok: { type: boolean, example: true }
                  role: { type: string, enum: [ADMIN] }
        "401":
          description: Oturum yok (`UNAUTHENTICATED`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Giriş yapılmış ama yönetici değil (`FORBIDDEN`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      tags: [admin]
      summary: Değiştiren yönetici isteği denemesi (iskelet)
      description: |
        Hiçbir şeyi değiştirmez; **işlem kaydını** kanıtlar: başarılı istek `AuditLog`'a `admin.ping` olarak, gövdedeki
        alan **adlarıyla** yazılır, değerler yazılmaz. Gövde JSON olmalıdır (`415`).
      security:
        - cookieAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, nullable: true, maxLength: 200 }
      responses:
        "204":
          description: Yapıldı ve kaydedildi
        "401":
          description: Oturum yok (`UNAUTHENTICATED`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Giriş yapılmış ama yönetici değil (`FORBIDDEN`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415":
          description: Gövde `application/json` değil (`BAD_REQUEST`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: novera_session

  parameters:
    Currency:
      name: currency
      in: query
      required: false
      description: Tutarların döneceği para birimi. Varsayılan `TRY`.
      schema: { $ref: "#/components/schemas/Currency" }

  responses:
    BadRequest:
      description: Bozuk istek (`BAD_REQUEST`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Oturum yok (`UNAUTHENTICATED`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Bulunamadı (`NOT_FOUND`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Çakışma (`VEHICLE_UNAVAILABLE`, `RESERVATION_NOT_CANCELLABLE`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationFailed:
      description: Doğrulama hatası (`VALIDATION_FAILED`, alan hataları `fieldErrors` içinde)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: |
        Hız sınırı aşıldı (`RATE_LIMITED`). Her uçta bir sınır vardır (hiçbiri açıkça verilmemişse 5 dakikada 300 istek;
        `GET /health` hariç), yani her uç `429` verebilir. Sınırlar ve anahtarlar docs/SECURITY.md'deki tablodadır.
      headers:
        Retry-After:
          description: Yeniden denemeden önce beklenecek saniye (sayacın içinde bulunduğu pencerenin kalan süresi).
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    # ---------- Ortak ----------
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Sabit makine kodu.
          enum:
            - BAD_REQUEST
            - VALIDATION_FAILED
            - UNAUTHENTICATED
            - FORBIDDEN
            - INVALID_CREDENTIALS
            - EMAIL_TAKEN
            - NOT_FOUND
            - VEHICLE_UNAVAILABLE
            - INVALID_DATE_RANGE
            - RESERVATION_LIMIT
            - RESET_TOKEN_INVALID
            - SPAM_DETECTED
            - RATE_LIMITED
            - PAYLOAD_TOO_LARGE
            - IN_USE
            - STALE_WRITE
            - CODE_TAKEN
            - SLUG_TAKEN
            - PLATE_TAKEN
            - NAME_TAKEN
            - VEHICLE_ASSIGNED
            - EMPLOYEE_NO_TAKEN
            - INVALID_TRANSITION
            - INTERNAL_ERROR
        message:
          type: string
          description: Geliştirici için İngilizce metin. Ekranda gösterilmez.
        details:
          type: object
          description: "`IN_USE` için nedenlerin sayıları (bayi: reservations, holds, vehicles); ekran bunları listeler."
          additionalProperties: { type: integer }
        fieldErrors:
          type: object
          description: Alan adı → sabit hata kodu.
          additionalProperties:
            type: string
            enum:
              - REQUIRED
              - INVALID_EMAIL
              - INVALID_FORMAT
              - TOO_SHORT
              - PASSWORD_TOO_COMMON
              - INVALID_PASSWORD
              - EMAIL_MISMATCH
              - TOO_LONG
              - OUT_OF_RANGE
              - EMAIL_TAKEN
              - CONSENT_REQUIRED
              - INVALID_DATE_RANGE
              - NOT_IN_SLOT
              - IN_PAST
              - UNKNOWN_REFERENCE
              - UNKNOWN_CODE
              - CODE_EXHAUSTED
              - CODE_ALREADY_USED
              - CODE_TAKEN
              - BELOW_USAGE
              - NOT_ALLOWED
              - SLUG_TAKEN
              - PLATE_TAKEN
              - NAME_TAKEN
              - EMPLOYEE_NO_TAKEN
          example: { email: EMAIL_TAKEN }

    LocalizedText:
      type: object
      required: [tr, en]
      properties:
        tr: { type: string }
        en: { type: string }

    Currency:
      type: string
      enum: [TRY, EUR, USD]

    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: integer
          format: int64
          description: Alt birimin (kuruş/cent) tam sayısı. 125000 TRY = ₺1.250.
          example: 125000
        currency: { $ref: "#/components/schemas/Currency" }

    QuoteStatus:
      type: string
      enum: [RECEIVED, IN_REVIEW, OFFERED, CLOSED]
      description: Talebin durumu; yalnızca ileri gider (`RECEIVED → IN_REVIEW → OFFERED → CLOSED`).

    QuoteSummary:
      type: object
      required: [id, number, createdAt, vehicleCount, durationMonths, status]
      properties:
        id: { type: string, format: uuid }
        number: { type: string, example: TKL-2026-00042 }
        createdAt: { type: string, format: date-time }
        vehicleCount: { type: integer, example: 10 }
        durationMonths: { type: integer, example: 24 }
        productSlug: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/QuoteStatus" }

    Received:
      type: object
      required: [received]
      properties:
        received: { type: boolean, example: true }

    # ---------- Katalog ----------
    OpeningHours:
      type: object
      description: Her alan `"08:30-19:00"` biçiminde ya da `"closed"`.
      required: [weekdays, saturday, sunday]
      properties:
        weekdays: { type: string, example: "08:30-19:00" }
        saturday: { type: string, example: "09:00-17:00" }
        sunday: { type: string, example: closed }

    BranchRef:
      type: object
      required: [id, name, city]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        city: { type: string }

    Branch:
      type: object
      required: [id, name, city, address, latitude, longitude, phone, email, kind, openingHours, vehicleModels]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: İzmir Adnan Menderes Havalimanı }
        city: { type: string, example: İzmir }
        address: { type: string }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        phone: { type: string }
        email: { type: string, format: email }
        kind: { $ref: "#/components/schemas/BranchKind" }
        openingHours: { $ref: "#/components/schemas/OpeningHours" }
        vehicleModels:
          type: array
          description: Bayideki modeller (arama formundaki bayi önizlemesi için).
          items:
            type: object
            required: [slug, brand, model]
            properties:
              slug: { type: string }
              brand: { type: string }
              model: { type: string }

    VehicleClass:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string, example: ekonomik }
        name: { $ref: "#/components/schemas/LocalizedText" }

    Consumption:
      type: object
      required: [value, unit]
      properties:
        value: { type: number, example: 4.5 }
        unit:
          type: string
          enum: [L_PER_100KM, KWH_PER_100KM]

    VehicleModelBase:
      type: object
      required: [slug, brand, model, class, seats, bags, transmission, fuelType, consumption, description, imageUrl]
      properties:
        slug: { type: string, example: toyota-corolla-hybrid }
        brand: { type: string, example: Toyota }
        model: { type: string, example: Corolla Hybrid }
        class: { $ref: "#/components/schemas/VehicleClass" }
        seats: { type: integer }
        bags: { type: integer }
        transmission: { type: string, enum: [MANUAL, AUTOMATIC] }
        fuelType: { type: string, enum: [PETROL, DIESEL, HYBRID, ELECTRIC] }
        consumption: { $ref: "#/components/schemas/Consumption" }
        description: { $ref: "#/components/schemas/LocalizedText" }
        imageUrl: { type: string, nullable: true }

    VehicleModel:
      allOf:
        - $ref: "#/components/schemas/VehicleModelBase"
        - type: object
          required: [fromDailyPrice, branches]
          properties:
            fromDailyPrice: { $ref: "#/components/schemas/Money" }
            branches:
              type: array
              items: { $ref: "#/components/schemas/BranchRef" }

    VehicleOffer:
      type: object
      required: [vehicleId, year, model, branch, days, dailyPrice, totalPrice]
      properties:
        vehicleId: { type: string, format: uuid }
        year: { type: integer, example: 2025, description: Aracın model yılı (`vehicleId` olan fiziksel araç). }
        model: { $ref: "#/components/schemas/VehicleModelBase" }
        branch: { $ref: "#/components/schemas/BranchRef" }
        days: { type: integer, example: 3 }
        dailyPrice: { $ref: "#/components/schemas/Money" }
        totalPrice:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: Araç için toplam (ek hizmet hariç). `dailyPrice × days`, aynı para biriminde.

    Extra:
      type: object
      required: [slug, name, price, pricing]
      properties:
        slug: { type: string, example: cocuk-koltugu }
        name: { $ref: "#/components/schemas/LocalizedText" }
        price: { $ref: "#/components/schemas/Money" }
        pricing:
          type: string
          enum: [PER_DAY, FIXED]

    ExchangeRate:
      type: object
      required: [currency, ratePerTry, updatedAt]
      properties:
        currency: { $ref: "#/components/schemas/Currency" }
        ratePerTry:
          type: number
          description: 1 TRY kaç `currency` ediyor (TRY için 1).
          example: 0.0291
        updatedAt: { type: string, format: date-time }

    # ---------- Rezervasyon ----------
    ReservationRequest:
      type: object
      required: [vehicleId, pickupBranchId, returnBranchId, startAt, endAt, currency]
      properties:
        vehicleId: { type: string, format: uuid }
        pickupBranchId: { type: string, format: uuid }
        returnBranchId: { type: string, format: uuid }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        currency: { $ref: "#/components/schemas/Currency" }
        holdId:
          type: string
          format: uuid
          description: "`POST /holds` cevabındaki tutma. Yalnızca `POST /reservations` kullanır; isteğe bağlı."
        promoCode:
          type: string
          nullable: true
          pattern: "^[A-Za-z0-9]{3,20}$"
          example: NOVERA10
          description: |
            Kampanya kodu. Büyük/küçük harf ve boşluk fark etmez; sunucu büyük harfe çevirir. Kod, araç ve
            ek hizmetlerin toplamından yüzde olarak düşer (aşağı yuvarlanır), sonra puan uygulanır.
            Biçime uymayan değer `422` (`fieldErrors.promoCode: INVALID_FORMAT`).
            **`POST /reservations/price`**: olmayan, kapalı, tarihi geçmiş, kullanım tavanı dolmuş ya da (girişli
            istekte) bu hesabın zaten kullandığı kod hata değildir; fiyat düz kalır ve cevaptaki `promo.applied`
            `false` olur ("kod geçerli değil" denir). Cevap bunların hangisi olduğunu **söylemez** (`promo.reason`
            yoktur), böylece kodlar deneyerek ayırt edilemez. Kod içeren istek istemci başına 10 dakikada en çok
            10 kez gönderilebilir (`429 RATE_LIMITED`).
            **`POST /reservations`**: böyle bir kodla rezervasyon yapılmaz, çünkü ziyaretçi indirim göreceğini
            sanmıştır: olmayan, kapalı ya da tarihi geçmiş kod `422` `fieldErrors.promoCode: UNKNOWN_CODE`;
            toplam kullanım tavanı dolmuşsa `CODE_EXHAUSTED`; kod kişi başına tek kullanımlıksa ve bu hesap
            kullanmışsa `CODE_ALREADY_USED`. Kullanım sayısı iptal edilmemiş rezervasyonlardan sayılır; iptal edilen
            rezervasyonun kodu geri döner. Sayım ve ekleme aynı işlemde, kod satırı kilitlenerek yapılır.
        usePoints:
          type: boolean
          description: |
            Puanla öde (gönderilmezse `false`). Giriş gerekir; yalnızca bireysel hesapta ve `currency: TRY` iken kullanılabilir
            (aksi halde `422`, `fieldErrors.usePoints: NOT_ALLOWED`). 1 puan ₺5'dir; harcanan puan, bakiye ve
            toplamın yarısıyla sınırlıdır, kiralama bedava olmaz. Kaç puanın harcandığını sunucu hesaplar
            (`pointsUsed`); istemci puan sayısı göndermez.
        extras:
          type: array
          items:
            type: object
            required: [slug, quantity]
            properties:
              slug: { type: string }
              quantity: { type: integer, minimum: 1, maximum: 10 }

    HoldRequest:
      type: object
      required: [vehicleId, pickupBranchId, returnBranchId, startAt, endAt]
      properties:
        vehicleId: { type: string, format: uuid }
        pickupBranchId: { type: string, format: uuid }
        returnBranchId: { type: string, format: uuid }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }

    Hold:
      type: object
      required: [id, vehicleId, expiresAt]
      properties:
        id: { type: string, format: uuid }
        vehicleId: { type: string, format: uuid }
        expiresAt:
          type: string
          format: date-time
          description: Tutmanın bittiği an (UTC). Geri sayım bununla yapılır; istemci saatine güvenilmez.

    PriceLine:
      type: object
      required: [type, slug, label, quantity, unitPrice, total]
      properties:
        type:
          type: string
          enum: [VEHICLE, EXTRA, DISCOUNT]
          description: |
            `DISCOUNT`, kampanya kodunun düştüğü tutardır: tek satır, her zaman en sonda, tutarları **eksi**.
            Böylece satırların toplamı yine `total`'a tam eşit kalır.
        slug:
          type: string
          description: Araç satırında modelin, ek hizmet satırında ek hizmetin, indirim satırında kodun `slug` değeri. Satırı adıyla değil bununla eşleştirin.
          example: cocuk-koltugu
        label: { $ref: "#/components/schemas/LocalizedText" }
        quantity:
          type: integer
          description: Araç için gün sayısı; ek hizmet için adet (günlük ek hizmette adet × gün).
        unitPrice: { $ref: "#/components/schemas/Money" }
        total: { $ref: "#/components/schemas/Money" }

    PriceBreakdown:
      type: object
      description: |
        Birim fiyatlar önce hedef para biriminin alt birimine çevrilir, sonra adet/günle çarpılır;
        bu yüzden satır toplamlarının toplamı `total`'a tam eşittir (ekranda yuvarlama yok).
      required: [currency, exchangeRate, days, lines, total, promo, pointsUsed, payable]
      properties:
        currency: { $ref: "#/components/schemas/Currency" }
        exchangeRate:
          type: number
          description: Hesapta kullanılan kur (1 TRY = ? currency).
        days: { type: integer }
        lines:
          type: array
          items: { $ref: "#/components/schemas/PriceLine" }
        total:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: "Kalemlerin toplamı: araç ve ek hizmetler eksi kampanya indirimi, puan düşülmeden."
        promo:
          type: object
          nullable: true
          description: "İstekte kod gönderildiyse kodun ne olduğu; gönderilmediyse `null`. Rezervasyonda her zaman `applied: true`."
          required: [code, applied, percent]
          properties:
            code: { type: string, example: NOVERA10 }
            applied: { type: boolean, description: Kod fiyattan bir şey düştü mü. }
            percent: { type: integer, nullable: true, description: Uygulanan yüzde; `applied` `false` ise `null`. }
        pointsUsed:
          type: integer
          description: Bu rezervasyonda puanla ödenen puan sayısı (kullanılmadıysa 0). İptalde iade edilir.
        payable:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: Puan düşüldükten sonra parayla ödenecek tutar (`total` − `pointsUsed` × ₺5). Puan kullanılmadıysa `total`'a eşittir.

    Reservation:
      type: object
      required: [id, number, status, vehicle, pickupBranch, returnBranch, startAt, endAt, price, pointsEarned, createdAt]
      properties:
        id: { type: string, format: uuid }
        number: { type: string, example: NVR-2026-00123 }
        status: { type: string, enum: [CONFIRMED, CANCELLED] }
        vehicle:
          type: object
          required: [id, year, model]
          properties:
            id: { type: string, format: uuid }
            year: { type: integer, example: 2025 }
            model: { $ref: "#/components/schemas/VehicleModelBase" }
        pickupBranch: { $ref: "#/components/schemas/BranchRef" }
        returnBranch: { $ref: "#/components/schemas/BranchRef" }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        price: { $ref: "#/components/schemas/PriceBreakdown" }
        pointsEarned: { type: integer, example: 12 }
        createdAt: { type: string, format: date-time }

    Points:
      type: object
      required: [balance, pending, history, rules]
      properties:
        balance: { type: integer, description: Kiralaması bitmiş rezervasyonların puanı. }
        pending: { type: integer, description: Kiralaması henüz bitmemiş (yaklaşan) rezervasyonların puanı. }
        history:
          type: array
          items:
            type: object
            required: [points, createdAt]
            properties:
              points: { type: integer, description: "Kazanılan puan artı, rezervasyonda harcanan puan eksi işaretlidir." }
              reservationNumber: { type: string, nullable: true }
              createdAt: { type: string, format: date-time, description: Puanın hesaba geçtiği an (kiralamanın bitişi). }
        rules: { $ref: "#/components/schemas/LocalizedText" }

    # ---------- Hesap ----------
    User:
      type: object
      required: [id, email, firstName, lastName, accountType, role, companyName, taxOffice, companyCity, companyPhone, contactTitle, salesContact, locale, theme, currency, hasPassword, googleLinked, hasFleet]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        firstName: { type: string }
        lastName: { type: string }
        accountType: { type: string, enum: [INDIVIDUAL, CORPORATE] }
        role:
          type: string
          enum: [CUSTOMER, ADMIN]
          description: Panel yetkisi (hesap türünden ayrıdır). Yalnızca `pnpm admin:create` `ADMIN` verir. Web yalnızca yönlendirme için okur; yetki API'dedir.
        companyName: { type: string, nullable: true }
        taxOffice: { type: string, nullable: true, description: Vergi dairesi. Yalnızca kurumsal hesapta dolu; bireyselde `null`. }
        companyCity: { type: string, nullable: true, description: Şirketin şehri. Yalnızca kurumsal hesapta dolu. }
        companyPhone: { type: string, nullable: true, description: Şirket telefonu. Yalnızca kurumsal hesapta dolu. }
        contactTitle: { type: string, nullable: true, description: Yetkilinin ünvanı. Yalnızca kurumsal hesapta dolu. }
        salesContact:
          type: object
          nullable: true
          description: Hesabın satış temsilcisi. Yalnızca kurumsal hesapta dolu; yoksa `null`.
          required: [name, email, phone]
          properties:
            name: { type: string }
            email: { type: string, format: email }
            phone: { type: string }
        locale: { type: string, enum: [tr, en] }
        theme: { type: string, enum: [light, dark, system], description: Varsayılan `light`. }
        currency: { $ref: "#/components/schemas/Currency" }
        notifications: { $ref: "#/components/schemas/Notifications" }
        hasPassword:
          type: boolean
          description: "`false` ise hesap Google ile açılmış ve henüz şifresi yok (şifre belirlemek için `/auth/forgot-password` akışı kullanılır, `/me/password` 409 döner)."
        googleLinked: { type: boolean, description: Hesap bir Google hesabına bağlı mı. }
        hasFleet: { type: boolean, description: "Kurumsal hesabın şirketinin etkin bir filo sözleşmesi var (V2-36). `true` ise Filom'un giriş noktaları görünür; bireysel hesapta ve sözleşmesiz şirkette `false`." }

    Notifications:
      type: object
      description: E-posta tercihleri. Varsayılan hatırlatma açık, kampanya kapalı (pazarlama postası için onay gerekir).
      required: [reminders, campaigns]
      properties:
        reminders: { type: boolean, description: Seyahat öncesi hatırlatma e-postası. }
        campaigns: { type: boolean, description: Kampanya e-postaları. }

    PasswordChange:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string }
        newPassword: { type: string, minLength: 8, maxLength: 128 }

    SessionInfo:
      type: object
      required: [id, current, createdAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        current: { type: boolean, description: İsteği yapan oturum. }
        device: { type: string, nullable: true, example: Chrome · Windows, description: Girişte tarayıcının bildirdiğinden çıkarılan kısa ad; bilinmiyorsa null. }
        createdAt: { type: string, format: date-time, description: Oturumun açıldığı an. }
        expiresAt: { type: string, format: date-time }

    AdminSummary:
      type: object
      required: [date, rentalsStartingToday, rentalsEndingToday, reservationsLast7Days, quotesAwaiting, unhandledMessages, serviceRequests]
      properties:
        date: { type: string, format: date, example: "2026-10-29", description: Bugün sayılarının hesaplandığı İstanbul günü. }
        rentalsStartingToday: { type: integer, minimum: 0, description: Bugün başlayan kiralama (iptal edilmemiş). }
        rentalsEndingToday: { type: integer, minimum: 0, description: Bugün biten kiralama (iptal edilmemiş). }
        reservationsLast7Days: { type: integer, minimum: 0, description: Bugün ve önceki altı İstanbul gününde yapılan, iptal edilmemiş rezervasyon. }
        quotesAwaiting: { type: integer, minimum: 0, description: Yanıt bekleyen teklif talebi (`RECEIVED`). }
        unhandledMessages:
          type: integer
          minimum: 0
          description: "Ele alınmamış iletişim mesajı (V2-32). Kişisel alanları saklama süresi dolduğu için silinmiş mesaj sayılmaz: yanıtlanacak bir şey kalmamıştır. `GET /admin/contact-messages?handled=false` aynı kuralla sayar."
        serviceRequests:
          type: integer
          nullable: true
          minimum: 0
          description: Açık servis talebi. Talepler gelene kadar (V2-41) `null`; ekran kartı gizler.

    PromoCodeStatus:
      type: string
      enum: [ACTIVE, SCHEDULED, INACTIVE, EXPIRED, EXHAUSTED]
      description: Kodun şimdiki durumu (öncelik sırası için `GET /admin/promo-codes` açıklamasına bak).

    PromoCode:
      type: object
      required: [code, percent, active, validFrom, validUntil, maxRedemptions, oncePerUser, used, deletable, status, createdAt, updatedAt]
      properties:
        code: { type: string, example: YAZ25, description: Büyük harf, harf ve rakam, 3–20 karakter. }
        percent: { type: integer, minimum: 1, maximum: 90 }
        active: { type: boolean, description: Kapalı kod hiçbir tarihte uygulanmaz. }
        validFrom: { type: string, format: date-time, nullable: true, description: Boşsa hemen geçerli. }
        validUntil: { type: string, format: date-time, nullable: true, description: Boşsa süresiz. Bitiş anı dahil değildir. }
        maxRedemptions: { type: integer, nullable: true, minimum: 1, description: Toplam kullanım tavanı; boşsa sınırsız. }
        oncePerUser: { type: boolean, description: Aynı hesap kodu bir kez kullanabilir. }
        used: { type: integer, minimum: 0, description: Kodu hâlâ tutan (iptal edilmemiş) rezervasyon sayısı. }
        deletable: { type: boolean, description: Hiçbir rezervasyonda, iptal edilmiş olsa bile, kullanılmamışsa true. }
        status: { $ref: "#/components/schemas/PromoCodeStatus" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time, description: Kaydın sürümü; değiştirirken geri gönderilir (`STALE_WRITE`). }

    PromoCodePage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/PromoCode" } }
        total: { type: integer, minimum: 0, description: Süzgeçten geçen tüm kodlar, yalnızca bu sayfa değil. }
        page: { type: integer }
        pageSize: { type: integer }

    PromoCodeCreate:
      type: object
      required: [code, percent]
      properties:
        code: { type: string, example: YAZ25 }
        percent: { type: integer, minimum: 1, maximum: 90 }
        active: { type: boolean, default: true }
        validFrom: { type: string, format: date-time, nullable: true }
        validUntil: { type: string, format: date-time, nullable: true }
        maxRedemptions: { type: integer, nullable: true, minimum: 1 }
        oncePerUser: { type: boolean, default: true }

    PromoCodeUpdate:
      type: object
      required: [updatedAt]
      properties:
        updatedAt: { type: string, format: date-time, description: Düzenlenen kaydın `updatedAt` değeri. }
        percent: { type: integer, minimum: 1, maximum: 90 }
        active: { type: boolean }
        validFrom: { type: string, format: date-time, nullable: true }
        validUntil: { type: string, format: date-time, nullable: true }
        maxRedemptions: { type: integer, nullable: true, minimum: 1 }
        oncePerUser: { type: boolean }

    BranchKind:
      type: string
      enum: [CITY, AIRPORT]
      description: Havalimanı tezgâhı ya da şehir ofisi. Eskiden addan çıkarılıyordu; artık bayinin kendi alanı.

    BranchUsage:
      type: object
      required: [reservations, holds, vehicles]
      description: Bayiyi açık tutan şeyler; hepsi sıfırsa bayi kapatılabilir.
      properties:
        reservations: { type: integer, minimum: 0, description: Gelecekte başlayan ya da bitecek iptal edilmemiş rezervasyon. }
        holds: { type: integer, minimum: 0, description: Süresi dolmamış araç tutma. }
        vehicles: { type: integer, minimum: 0, description: Bayideki açık araç. }

    AdminBranch:
      type: object
      required: [id, name, city, address, latitude, longitude, phone, email, kind, openingHours, status, closedAt, activeVehicles, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: İstanbul Kadıköy }
        city: { type: string, example: İstanbul, description: 81 ilden biri. }
        address: { type: string }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        phone: { type: string }
        email: { type: string, format: email }
        kind: { $ref: "#/components/schemas/BranchKind" }
        openingHours: { $ref: "#/components/schemas/OpeningHours" }
        status: { type: string, enum: [OPEN, CLOSED] }
        closedAt: { type: string, format: date-time, nullable: true, description: Kapatıldığı an; açıksa null. }
        activeVehicles: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time, description: Kaydın sürümü; değiştirirken geri gönderilir (`STALE_WRITE`). }

    AdminBranchDetail:
      allOf:
        - $ref: "#/components/schemas/AdminBranch"
        - type: object
          required: [usage]
          properties:
            usage: { $ref: "#/components/schemas/BranchUsage" }

    AdminBranchPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AdminBranch" } }
        total: { type: integer, minimum: 0, description: Süzgeçten geçen tüm bayiler, yalnızca bu sayfa değil. }
        page: { type: integer }
        pageSize: { type: integer }

    AdminBranchCreate:
      type: object
      required: [name, city, address, latitude, longitude, phone, email, kind, openingHours]
      properties:
        name: { type: string, maxLength: 80 }
        city: { type: string, example: Ankara }
        address: { type: string, maxLength: 200 }
        latitude: { type: number, format: double, minimum: 35.5, maximum: 42.5 }
        longitude: { type: number, format: double, minimum: 25.5, maximum: 45.0 }
        phone: { type: string, maxLength: 30 }
        email: { type: string, format: email, description: Küçük harfe çevrilir. }
        kind: { $ref: "#/components/schemas/BranchKind" }
        openingHours: { $ref: "#/components/schemas/OpeningHours" }

    AdminBranchUpdate:
      type: object
      required: [updatedAt]
      properties:
        updatedAt: { type: string, format: date-time, description: Düzenlenen kaydın `updatedAt` değeri. }
        name: { type: string, maxLength: 80 }
        city: { type: string }
        address: { type: string, maxLength: 200 }
        latitude: { type: number, format: double, minimum: 35.5, maximum: 42.5 }
        longitude: { type: number, format: double, minimum: 25.5, maximum: 45.0 }
        phone: { type: string, maxLength: 30 }
        email: { type: string, format: email }
        kind: { $ref: "#/components/schemas/BranchKind" }
        openingHours: { $ref: "#/components/schemas/OpeningHours" }

    FuelType:
      type: string
      enum: [PETROL, DIESEL, HYBRID, ELECTRIC]
      description: Yakıt. Tüketim birimi bundan çıkar (elektrikte kWh, diğerlerinde litre).

    Transmission:
      type: string
      enum: [MANUAL, AUTOMATIC]

    AdminVehicleModel:
      type: object
      required: [slug, brand, model, class, fuelType, transmission, seats, bags, consumption, dailyPrice, description, imageUrl, status, retiredAt, activeVehicles, createdAt, updatedAt]
      properties:
        slug: { type: string, example: renault-clio, description: Modelin adresi; oluşturulduktan sonra değişmez. }
        brand: { type: string, example: Renault }
        model: { type: string, example: Clio }
        class:
          type: object
          required: [slug, name]
          properties:
            slug: { type: string }
            name: { $ref: "#/components/schemas/LocalizedText" }
        fuelType: { $ref: "#/components/schemas/FuelType" }
        transmission: { $ref: "#/components/schemas/Transmission" }
        seats: { type: integer, minimum: 1, maximum: 9 }
        bags: { type: integer, minimum: 0, maximum: 10 }
        consumption:
          type: object
          required: [value, unit]
          properties:
            value: { type: number }
            unit: { type: string, enum: [L_PER_100KM, KWH_PER_100KM], description: Elektrikte kWh, diğer yakıtlarda litre; yakıttan çıkar, verilmez. }
        dailyPrice: { type: integer, minimum: 1, maximum: 10000000, description: TRY kuruş (₺1.250 = 125000). }
        description: { $ref: "#/components/schemas/LocalizedText" }
        imageUrl: { type: string, nullable: true, description: "`/fleet/…` site yolu ya da fotoğraf deposunun adresi; boşsa site yer tutucu çizer." }
        status: { type: string, enum: [ACTIVE, RETIRED] }
        retiredAt: { type: string, format: date-time, nullable: true }
        activeVehicles: { type: integer, minimum: 0, description: Bu modelin açık araçları, tüm bayilerde. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time, description: Kaydın sürümü; değiştirirken geri gönderilir (`STALE_WRITE`). }

    AdminVehicleModelDetail:
      allOf:
        - $ref: "#/components/schemas/AdminVehicleModel"
        - type: object
          required: [usage]
          properties:
            usage:
              type: object
              required: [reservations, holds]
              description: Modeli sitede tutan şeyler; ikisi de sıfırsa model kaldırılabilir.
              properties:
                reservations: { type: integer, minimum: 0, description: Modelin bir aracıyla gelecekte başlayacak iptal edilmemiş rezervasyon. }
                holds: { type: integer, minimum: 0, description: Modelin bir aracında süresi dolmamış araç tutma. }

    AdminVehicleModelPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AdminVehicleModel" } }
        total: { type: integer, minimum: 0, description: Süzgeçten geçen tüm modeller, yalnızca bu sayfa değil. }
        page: { type: integer }
        pageSize: { type: integer }

    AdminVehicleModelCreate:
      type: object
      required: [brand, model, classSlug, fuelType, transmission, seats, bags, consumption, dailyPrice, description]
      properties:
        brand: { type: string, maxLength: 40 }
        model: { type: string, maxLength: 60 }
        slug: { type: string, minLength: 3, maxLength: 60, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", description: İsteğe bağlı; yoksa marka ve modelden üretilir. }
        classSlug: { type: string, example: ekonomik }
        fuelType: { $ref: "#/components/schemas/FuelType" }
        transmission: { $ref: "#/components/schemas/Transmission" }
        seats: { type: integer, minimum: 1, maximum: 9 }
        bags: { type: integer, minimum: 0, maximum: 10 }
        consumption: { type: number, exclusiveMinimum: 0, maximum: 100, description: Elektrikte kWh/100 km, diğerlerinde L/100 km. Bir ondalığa yuvarlanır. }
        dailyPrice: { type: integer, minimum: 1, maximum: 10000000, description: TRY kuruş. }
        description: { $ref: "#/components/schemas/LocalizedText" }
        imageUrl: { type: string, nullable: true }

    AdminVehicleModelUpdate:
      type: object
      required: [updatedAt]
      properties:
        updatedAt: { type: string, format: date-time, description: Düzenlenen kaydın `updatedAt` değeri. }
        brand: { type: string, maxLength: 40 }
        model: { type: string, maxLength: 60 }
        classSlug: { type: string }
        fuelType: { $ref: "#/components/schemas/FuelType" }
        transmission: { $ref: "#/components/schemas/Transmission" }
        seats: { type: integer, minimum: 1, maximum: 9 }
        bags: { type: integer, minimum: 0, maximum: 10 }
        consumption: { type: number, exclusiveMinimum: 0, maximum: 100 }
        dailyPrice: { type: integer, minimum: 1, maximum: 10000000 }
        description: { $ref: "#/components/schemas/LocalizedText" }
        imageUrl: { type: string, nullable: true }

    AdminVehicle:
      type: object
      required: [id, plate, year, status, model, branch, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        plate: { type: string, example: "34 NV 1001", description: "Türk plakası, `34 ABC 123` biçiminde saklanır." }
        year: { type: integer, minimum: 2015, example: 2025 }
        status: { type: string, enum: [ACTIVE, INACTIVE], description: "`ACTIVE` kiralanabilir; `INACTIVE` aramada çıkmaz ve rezervasyon almaz. Araç silinmez." }
        model:
          type: object
          required: [slug, brand, model, retired]
          properties:
            slug: { type: string, example: renault-clio }
            brand: { type: string, example: Renault }
            model: { type: string, example: Clio }
            retired: { type: boolean, description: Model kaldırılmışsa araç yeniden açılamaz. }
        branch:
          type: object
          required: [id, name, city, closed]
          properties:
            id: { type: string, format: uuid }
            name: { type: string, example: İstanbul Kadıköy }
            city: { type: string, example: İstanbul }
            closed: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time, description: Kaydın sürümü; değiştirirken geri gönderilir (`STALE_WRITE`). }

    AdminVehicleDetail:
      allOf:
        - $ref: "#/components/schemas/AdminVehicle"
        - type: object
          required: [usage]
          properties:
            usage:
              type: object
              required: [reservations, holds]
              description: Aracı yerinde tutan şeyler; ikisi de sıfırsa araç taşınabilir ve kapatılabilir.
              properties:
                reservations: { type: integer, minimum: 0, description: Araçla gelecekte başlayacak iptal edilmemiş rezervasyon. }
                holds: { type: integer, minimum: 0, description: Süresi dolmamış araç tutma. }

    AdminVehiclePage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AdminVehicle" } }
        total: { type: integer, minimum: 0, description: Süzgeçten geçen tüm araçlar, yalnızca bu sayfa değil. }
        page: { type: integer }
        pageSize: { type: integer }

    AdminVehicleCreate:
      type: object
      required: [plate, year, modelSlug, branchId]
      properties:
        plate: { type: string, maxLength: 30, example: "34 abc 123", description: "Nasıl yazılırsa yazılsın büyük harfe çevrilir ve `34 ABC 123` olarak saklanır." }
        year: { type: integer, minimum: 2015, description: 2015 ile bu yıl + 1 arası. }
        modelSlug: { type: string, example: renault-clio }
        branchId: { type: string, format: uuid }

    AdminVehicleUpdate:
      type: object
      required: [updatedAt]
      properties:
        updatedAt: { type: string, format: date-time, description: Düzenlenen kaydın `updatedAt` değeri. }
