name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The generated Prisma client is not in Git (apps/api/src/generated is ignored), so CI has to
      # produce it before anything that type-checks the API: lint is type-aware, build compiles it.
      # generate never connects to a database; the address only has to exist for the config file.
      - name: Generate Prisma client
        run: pnpm --filter @novera/api exec prisma generate
        env:
          DATABASE_URL: postgresql://novera:novera@localhost:5432/novera

      - name: Lint
        run: pnpm -r --if-present run lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm -r --if-present run test

      - name: Build
        run: pnpm -r --if-present run build

      # Starts the built site with sample data and follows every internal link on every page in
      # the sitemap; one that leads nowhere fails the build (BACKLOG Y31).
      - name: Check links
        env:
          USE_MOCKS: "1"
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
        run: |
          pnpm --filter @novera/web start &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/sitemap.xml > /dev/null && break; sleep 2; done
          pnpm --filter @novera/web check-links

      # Walks the main flows (search, hold, summary, payment, forms, account, cookie banner) in a
      # real browser at 375 and 1280 px against the built site with sample data (SPEC §8).
      - name: End-to-end tests
        env:
          PLAYWRIGHT_CHANNEL: ""
        run: |
          pnpm --filter @novera/web exec playwright install --with-deps chromium
          pnpm --filter @novera/web test:e2e
      - name: Upload the Playwright traces of a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: apps/web/test-results