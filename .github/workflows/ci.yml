name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    # A real PostgreSQL for the API integration tests (availability query, holds).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: novera
          POSTGRES_PASSWORD: novera
          POSTGRES_DB: novera_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U novera -d novera_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A high or critical advisory in what the app ships fails the build (V2-18). The few that never run in the
      # app (the Prisma command-line tool) are on a written, dated allowlist: scripts/audit-allowlist.json.
      - name: Dependency audit
        run: pnpm audit:prod

      - name: Audit rule tests
        run: pnpm test:scripts

      # The generated Prisma client is not in Git (apps/api/src/generated is ignored), so CI has to
      # produce it before anything that type-checks the API: lint is type-aware, build compiles it.
      # generate never connects to a database; the address only has to exist for the config file.
      - name: Generate Prisma client
        run: pnpm --filter @novera/api exec prisma generate
        env:
          DATABASE_URL: postgresql://novera:novera@localhost:5432/novera

      - name: Migrate test database
        run: pnpm --filter @novera/api exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://novera:novera@localhost:5432/novera_test

      # Replays every migration on an empty database and compares the result with schema.prisma (V2-11, QUALITY V-05).
      # A change to the schema that has no migration, or a migration edited by hand away from the schema, fails here
      # (exit code 2). The shadow database is the empty one the replay needs.
      - name: Check migrations against the schema
        run: |
          PGPASSWORD=novera psql -h localhost -U novera -d novera_test -c 'CREATE DATABASE novera_shadow'
          pnpm --filter @novera/api exec prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --exit-code
        env:
          DATABASE_URL: postgresql://novera:novera@localhost:5432/novera_test
          SHADOW_DATABASE_URL: postgresql://novera:novera@localhost:5432/novera_shadow

      - name: Lint
        run: pnpm -r --if-present run lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm -r --if-present run test
        env:
          TEST_DATABASE_URL: postgresql://novera:novera@localhost:5432/novera_test

      - name: Build
        run: pnpm -r --if-present run build

      # Starts the built site with sample data and follows every internal link on every page in
      # the sitemap; one that leads nowhere fails the build (BACKLOG Y31).
      - name: Check links
        env:
          USE_MOCKS: "1"
          # Marks a test run: without it the production bundle refuses to start with sample data (ADR-29).
          NOVERA_E2E: "1"
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
        run: |
          pnpm --filter @novera/web start &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/sitemap.xml > /dev/null && break; sleep 2; done
          pnpm --filter @novera/web check-links

      # Walks the main flows (search, hold, summary, payment, forms, account, cookie banner) in a
      # real browser at 375 and 1280 px against the built site with sample data (SPEC §8).
      - name: End-to-end tests
        env:
          PLAYWRIGHT_CHANNEL: ""
        run: |
          pnpm --filter @novera/web exec playwright install --with-deps chromium
          pnpm --filter @novera/web test:e2e
      - name: Upload the Playwright traces of a failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: apps/web/test-results

  # The API's container (the Dockerfile at the root, built by Cloud Build on every merge to main): a Dockerfile that
  # no longer builds would only show up after the merge, so it is built here too. Nothing is pushed.
  api-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the API image
        run: docker build -t novera-api:ci .
      - name: The image starts and refuses to run without its production settings
        run: |
          set +e
          output=$(docker run --rm -e NODE_ENV=production novera-api:ci 2>&1)
          status=$?
          echo "$output" | tail -3
          test "$status" -ne 0
          echo "$output" | grep -q "API_ACCESS_KEY"
