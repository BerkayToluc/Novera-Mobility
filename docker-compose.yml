services:
  db:
    image: postgres:17
    container_name: novera-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - novera-db-data:/var/lib/postgresql/data

volumes:
  novera-db-data: